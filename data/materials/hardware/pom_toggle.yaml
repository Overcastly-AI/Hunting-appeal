id: pom_toggle
name: Toggle bar 30 x 8 x 5 mm, cut from black POM / acetal sheet
category: hardware
generic: false
trade_names: []
supplier_examples:
- Beeplastic (black POM sheet 300 x 300 x 5 mm, USD 33.79)
- McMaster-Carr (acetal sheet and bar)
- Simply Plastics UK (acetal copolymer sheet cut to size)
properties:
  length_mm: 30
  width_mm: 8
  thickness_mm: 5
  mass_g: 1.7
  pull_through_n: 670
  quietness_1to5: 5
confidence: estimate
sources:
- "Black POM sheet 300 x 300 x 5 mm, USD 33.79 (grade, homo- or copolymer, not stated): Beeplastic, https://www.beeplastic.com/products/pom-acetal-sheet-1-5-35mm-cnc-diy-cutting (accessed 2026-11-13; selector showed some sizes sold out)"
- "mass_g computed: 30 x 8 x 5 = 1200 mm3 x 1.42 g/cm3 (pom_acetal density_kg_m3 1420) = 1.70 g, before edge rounding"
- "bending section modulus computed: b h^2 / 6 = 8 x 5^2 / 6 = 33.3 mm3 (bending about the 5 mm axis), matches attach_system.TOGGLE_N basis"
- "ASSUMPTION pull_through_n = 670 N: carried from attach_system.TOGGLE_N (pom_acetal yield ~65-70 MPa across a 27 mm slot). Settled by: 5 toggles sewn in 25 mm webbing pulled through a 27 x 5 mm slot in the B-28 / hood ladder material at 50 mm/min, dry and at -20 C (POM is notch sensitive in cold), pass >= 670 N"
- "pieces per sheet computed: 300 mm / (8 + 1.5 mm kerf) = 31 strips x 300 / (30 + 1.5) = 9 = 279 toggles from one 300 x 300 sheet"
cost_usd:
  value: 0.12
  per: unit
notes: 'Material cost only: USD 33.79 / 279 = USD 0.12 a toggle. Cutting and edge rounding is CMT labour (about 20 s
  each on a band saw + sander, ASSUMPTION). Mass 1.7 g against attach_system.TOGGLE_G 3.0 g: -1.3 g per toggle (4 on the
  BOM). If the owner would rather buy than cut, a moulded 30 mm cord toggle is the fallback, but none found at this
  size with a published strength. Use black (UV-stabilised by carbon black); natural POM yellows and chalks in UV.
  Break all edges (R 1 mm) so the toggle does not cut the webbing it is sewn into.'
