notes: 'Replaces the corrie.py SHOCK_NOTE proxy (2 mm Dyneema 2.5 g/m): real 3 mm shock cord is 6 g/m, so every
  shock-cord metre books +3.5 g. Use the lower break (280 N) for design; shock cord is a closure, not a load path.
  Latex cores age in UV and heat (expect sag after a few seasons); buy black or coyote, never with a reflective
  tracer for hunting. cost_usd is an ASSUMPTION (typical small-roll retail, no single cited price).'
