notes: 'Vendor-published lab break (datasheet confidence, but not a guaranteed minimum). Cost converted at about
  1.09 USD/EUR (ASSUMPTION). For the hipbelt concept B 2:1 turn it carries both legs = T: worst T 483 N (XXL, M42,
  19 in torso, mu 0.3), so break / T = 6.4 and break / (2.0 x T limit, 966 N) = 3.2. Use it in place of the
  "no record, 5 g, $1" ASSUMPTION in hipbelt_concepts.belt_bom (+1 g, +$0.85 per ring). The 4 mm round section is a
  tight bend for webbing (it sets the 2:1 friction loss); keep the 0.85 efficiency ASSUMPTION until HB-3. Acetal
  D-rings (ITW / Fastex 1 in) have no published rating and were not chosen for a load path. Anodised aluminium: order
  matt black, sleeve or tab-wrap it so it does not tick against the ladder lock or buckle.'
