notes: 'ESTIMATE, sources secondary (retailer copies of the maker figures; the maker page was not fetched). A certified climbing
  carabiner: EN 12275 requires every type to meet its marked strengths, so the margin does not rest on a reseller
  lab figure. No no-set load is published; BL-010 takes 0.5 x the minor-axis rating (4000 N) as the proof limit
  (ASSUMPTION, conservative: the proof loads the major axis). Chosen by BL-010 (2026-11-11) for the two IM3 bag hooks
  (factored 1702 N, proof 2553 N), the IM3 meat-strap free end (proof 908 N) and, as the same spare part, the two
  B-24 float links (misuse 941 N). The tongue loop (38 mm) bunches in the basket: the proof test PT-1 must use the
  sewn tongue, not a pin. Wiregate: quieter than a solid gate and does not freeze shut; tape or sleeve it (TPU hook
  sleeve) against ticking on the fairlead. cost_usd is an ASSUMPTION.'
