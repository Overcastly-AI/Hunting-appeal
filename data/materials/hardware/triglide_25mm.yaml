notes: 'Price: EUR 0.40 incl. VAT = EUR 0.34 ex VAT x 1.09 USD/EUR (ASSUMPTION) = USD 0.37. Mass 2.6 g is 0.4 g under
  attach_system.TRIGLIDE_G (3.0 g). Use as a TAIL KEEPER only. meat_haul.py says the under-strap tri-glide "sits behind
  the cam so a slip cannot lengthen the cradle": a 2.6 g nylon tri-glide is not a rated part and will not stop a cam
  that slips at about 1100 N. If the tri-glide is meant as a slip backstop, use the stainless 25 mm tri-glide
  (11 g, 3.75 kN break, about USD 2.85 ex VAT) and test it as a backstop. Matte black; nylon absorbs water (slightly
  lower slip wet).'
