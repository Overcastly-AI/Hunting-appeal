notes: 'PRICE CORRECTION: the BOM assumed USD 6.00 a cam (PRICE_ASSUMED cam_25mm_al). The light rated-class
  aluminium cam that the 13 g design mass is based on costs USD 25.50 (RBTR) to about USD 26.50 ex VAT (Extremtextil,
  EUR 24.29 x 1.09 USD/EUR ASSUMPTION). Five cams = USD 127.50 per bag, not USD 30. Mass 12.2 g + about 1 g glove
  pull tab = 13 g matches strap_arch.CAM25_G. Cheaper cams exist (die-cast zinc or steel 25 mm tie-down cams, USD
  2-5) but are 40-110 g each (a galvanised 25 mm steel cam is listed at 0.111 kg / 600 daN) and noisy: rejected for
  weight. Both resellers showed stock problems on 2026-11-13: order the prototype set early. Not certified by the
  maker; the 1100 N slip value is unproven and governs the IM and US strap checks until the cam test passes.'
