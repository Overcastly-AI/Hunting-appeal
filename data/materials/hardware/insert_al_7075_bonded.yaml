notes: 'ESTIMATE of bonded pull-out (12 mm OD x 20 mm bond, epoxy, derated); verify by pull-testing 5 samples. Used
  for load-lifter, hipbelt pivot and shelf-strap hard points in carbon tubes/plates. GALVANIC: aluminum in contact
  with carbon corrodes (carbon is cathodic), especially with salty blood/sweat - hard-anodize AND keep an insulating
  layer (adhesive bondline with glass beads, or one E-glass ply / G10 washer); never let bare Al touch carbon. Cheaper
  and lighter than Ti.'
