notes: 'Rockywoods single price (USD 1.99) for the prototype; at volume Shelby lists EUR 0.75-0.90 (about USD 0.55-0.65
  ex VAT at 1.09 USD/EUR, ASSUMPTION). MASS CORRECTION: the bag concepts book 6 g a slider (bag_concepts.SLIDER_G,
  build_geometry zip row). Three independent listings put a #10 metal coil slider at 18-19.4 g, so the D2 door (2
  sliders) is about +26 g against the ledger. A lighter option is the YKK #10 slider with a cord loop in place of the
  metal tab (no weight published; the body alone is most of the mass, so expect 12-15 g, ASSUMPTION, weigh one).
  Buy YKK sliders for YKK chain (coil_zipper_10); YKK forbids mixing on other chain, and fit on a third-party chain is
  not guaranteed. Matte black paint; no optical brightener issue (metal).'
