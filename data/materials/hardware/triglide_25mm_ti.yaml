notes: 'NO PUBLISHED RATING. The mass is the maker''s own figure (4 g a piece; weigh 5 on receipt). Availability: sold
  out on 2026-11-24, small maker, no MOQ quoted; ask BEW for a restock date before booking N3. Price per part = USD 4.25
  (pack of 2), not the USD 12 that iter1_weight.py assumes (TI_TRIGLIDE_USD). Strength by inference only (NOT a
  rating): the stainless part (triglide_25mm stainless_alt, 304, 11 g, 3.75 kN break) has about 1.4 cm3 of metal
  (11 g / 7.9 g/cm3); the Ti part has about 0.9 cm3 (4 g / 4.43 g/cm3, record ti_6al_4v), so its bars are thinner. Ti-6Al-4V
  is about 1.9x stronger in UTS (950 vs 505 MPa) and 4x in yield (880 vs 215 MPa) than annealed 304 per area (records
  ti_6al_4v, sst_304_annealed), so the break could land
  anywhere near the stainless part, but a thinner centre bar bends and has a sharper edge on the webbing. Do not
  credit any number until TG-TI and US-BS-Ti (docs/backlog/BL-064-iter1-materials.md) pass. Proposed bench test TG-TI:
  weigh 5 and caliper the centre and end bars; then on 2 parts thread 25 mm poly webbing as the US backstop and
  ramp-pull at 50 mm/min to failure (bar yield, webbing cut or slip), reporting peak load and the failure mode;
  pass line (ASSUMPTION): peak >= 1620 N (1.5 x the 1080 N US-BS proof) with no webbing cut below 1080 N.'
