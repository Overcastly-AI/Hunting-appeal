notes: 'ESTIMATE. tensile_rating_n is the reseller-published ITW value (test method not stated). No maker publishes
  a SLIP rating for any 25 mm plastic ladder lock (ITW, Duraflex, YKK searched 2026-11-09). ASSUMPTION: slip_load_n
  = 0.5 x tensile rating, the same ratio basis as ladder_lock_25mm (300 / 600). mass_g is an ASSUMPTION scaled from
  the ITW GTLL classic (0.136 oz = 3.9 g, Rockywoods) by the larger Superloc envelope (34 x 50 x 10 mm); weigh one.
  For the hipbelt 2:1 forward pull (concept B) the lock leg carries pull_n = T / (2 x 0.85) during and after cinching:
  worst 284 N at XXL (M42, 19 in torso), so 490 / 284 = 1.73 (S 2.31, M 2.55, L 2.26, XL 2.18). This must be
  QUALIFIED BY TEST before release: 5 locks on the chosen 25 mm poly webbing, pull the loaded leg at 50 mm/min,
  pass = no slip > 5 mm below 430 N (1.5 x 284 N) at 20 C and at -20 C, wet and dry. If it fails, the fallbacks in
  order are (a) the 25 mm aluminium ladderlock (Extremtextil "ergonomic", 326 daN break, 9.2 g; slip unrated), (b)
  the Austere Mfg aluminium ladderlock with stainless grip pins (11.9 g, about EUR 24; slip unrated, "makes it
  difficult for the webbing to slip"), (c) a 1 in steel cam buckle (Trucking Depot 600 lbf assembly break, where the
  WSTDA-style assembly rating includes slip, but 40-170 g and noisy: rejected for a hunting belt). Stepping to
  38 mm does not help: the reseller lists the ITW classic 40 mm at 60 kg, below the 25 mm at 70 kg. Matte black, no
  brightener. Wider and taller than the classic: check the clearance at the buckle-side tab.'
