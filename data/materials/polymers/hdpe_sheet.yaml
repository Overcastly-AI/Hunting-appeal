notes: Standard pack framesheet (1.5-2.0 mm). Stays tough well below -40 C (no cold cracking), creeps under sustained
  load; use as a load-spreading plate, not the primary vertical load path. Cannot be glued easily; mechanically
  fasten or sew through drilled holes. Quiet when flexed (no crinkle).
