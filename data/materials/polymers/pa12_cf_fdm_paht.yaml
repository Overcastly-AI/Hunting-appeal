notes: 'Design uses the LOWER published Z strength (47 MPa) because two revisions of the same sheet disagree
  (64 vs 47). Max overhang ~70 deg from vertical per TDS (= 20 deg from horizontal). PA12-based: retains
  properties wet better than PA6-CF (TDS). Needs hardened nozzle, enclosure (chamber 45-60 C), dry box. Frame-study fields (2026-11-01, ASSUMPTIONS, no published creep data): env_knockdown_ratio 0.8, modulus_40c_wet_ratio 0.6, creep_modulus_8h_40c_ratio 0.7, creep_rupture_8h_40c_ratio 0.4, fatigue_1e5_ratio 0.3, Tg ~45 C. modulus_60c_ratio 0.35 is an ASSUMPTION for a 60 C truck cab (above Tg): the printed-frame study cites NETZSCH DMA on LS-PA12, E prime falling through the glass transition (about 1438 to 500 MPa). BL-077 HOT/WET BASIS (supersedes env_knockdown_ratio 0.8 for any PAHT frame check from BL-077 on; the old fields are kept for the legacy studies that read them): B-basis at the TDS n (n not stated; ISO 527-1 minimum 5, k 3.4066) on the LOWER published mean of each property: XY 88 - 3.4066 x 7 = 64.15 MPa (V2.0 mean), Z 47 - 3.4066 x 5 = 29.97 MPa (V3.0 mean). Wet (23-25 C, saturated at 55 % RH): Bambu bending pairs XY 115 / 125 = 0.92 and Z 49 / 61 = 0.803 with a stated 12-18 % decline: XY 0.82 (the 18 % floor), Z 0.80 (lowest reading taken, review 8 rule). Hot 40 C: 0.82, the lowest of the Ciganas PA12 CF15 UTS ratio 40 / 23 C = 0.8215 and the Tg-shift readings of that curve (0.826-0.829) with the wet Tg 47-58 C (Bambu dry DSC Tg 70 C depressed by 11.3-26.5 C per wt % water, the BL-073 rates; glass_transition_wet_c 47 is the lower estimate). Knocked: XY 43.14, Z 19.66 MPa; interlayer shear tau = Z / sqrt 3 = 11.35 MPa (von Mises; the frame code rule 0.6 x Z had no source). Modulus 40 C / 23 C 0.716 (Ciganas); x wet strength ratio 0.82 = 0.587 (ASSUMPTION E-WET), 2 % under the booked modulus_40c_wet_ratio 0.6. Tg was 45 C (ASSUMPTION, 2026-11-01); TDS V3.0 says 70 C (DSC, dry). TDS V3.0 also lists lower bending (XY 125 vs 140 here) and elongation (8.4 / 4.1 vs 10.4 / 5.2) than V2.0; the V2.0 values are kept for the legacy studies that read them, no H1 row uses them (BL-077 open item). Settled by the BL-077 coupons CA-3-PAHT (Z and SBS at 40 C on conditioned, layer-time-matched coupons, n 10) and CA-1-PAHT (SBS fatigue at 40 C).'
