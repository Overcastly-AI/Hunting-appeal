notes: 'Values recalled from the TDS headline numbers - verify against current sheets. lap_shear_strength_cfrp_mpa
  and peel are ESTIMATES (substrate failure / peel at room temp). PICK for bonded tube-to-node joints: high strength,
  gap filling, forgiving 60 min work life for a beginner. Strength drops above ~60 C (car in sun) - keep design
  bondline stress <= 1/3 of lap shear and avoid peel loading (design joints in shear with >= 25 mm overlap, tapered
  edges). SURFACE PREP (decides the joint): carbon - sand with 120-180 grit to remove gloss/peel-ply, wipe with
  acetone/IPA, bond within 1 h; aluminum - abrade + solvent wipe, ideally sol-gel or phosphoric/chromic etch; titanium
  - abrade + solvent, primer. Control bondline 0.15-0.3 mm with 0.2 mm glass beads or wire shims. Room-temp cure
  24 h; 1-2 h at 65 C post-cure raises Tg and strength. Cost per 50 ml cartridge.'
