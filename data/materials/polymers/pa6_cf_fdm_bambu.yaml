notes: 'ASSUMPTIONS (no published data for this grade): tensile_strength_z = 0.645 x XY (PolyMide ratio);
  density 1170 (Polymaker PA6-CF20 value; one reseller lists 1090 - the higher value is used for mass);
  glass transition ~50 C dry, lower when moisture-conditioned (PA6 is plasticized by water);
  env_knockdown_ratio 0.75 (conditioned/40 C strength vs dry 23 C; PolyMide conditioned XY = 0.78 x dry);
  modulus_40c_wet_ratio 0.55, creep_modulus_8h_40c_ratio 0.7, creep_rupture_8h_40c_ratio 0.4 (no published
  creep data found for printed PA6-CF; CNC Kitchen reports "a serious creep problem" without annealing,
  https://www.cnckitchen.com/blog/carbon-fiber-nylon-in-3d-printing-pa6-vs-pa12-tested); fatigue_1e5_ratio 0.3
  (as the generative lug study). These must be confirmed by the coupon tests in printed_frame_study.md.'
