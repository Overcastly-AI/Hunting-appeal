sources:
- 'Bambu Lab PPS-CF Technical Data Sheet V1.0 (PDF dated 2024-08-23, read 2026-11-25 via pdftotext): density 1.26 g/cm3 ISO 1183; Tg 100 C, Tm 284 C, Tc 214 C; Vicat 268 C; HDT 235 C at 1.8 MPa, 264 C at 0.45 MPa; saturated water 0.05 % at 25 C / 55 % RH; E XY 8230 +/- 270, Z 2850 +/- 160 MPa; tensile XY 87 +/- 5, Z 24 +/- 3 MPa; elongation XY 1.2, Z 0.7 %; flexural modulus XY 7160, Z 2460 MPa; flexural strength XY 142, Z 36 MPa; Charpy XY 27.8 unnotched / 6.2 notched, Z 2.8 kJ/m2; drying 100-140 C 8-12 h; nozzle 0.4/0.6 (recommended)/0.8 mm, 310-340 C; bed 100-120 C, glue; fan 0-40 %; chamber 60-90 C (90 C and 335 C give higher Z); max overhang ~70 deg; anneal 180-220 C 6-12 h may warp and lower toughness; specimens X1E, chamber 60 C, not annealed; https://www.additive-x.com/shop/mpattachments/file/viewonline/id/918/product_id/2730'
- 'Bambu Lab JP store PPS-CF page (search snippet, page not fetchable): compatible with X1E / H2D / H2S only, 0.2 mm nozzle not supported, AMS not supported; https://jp.store.bambulab.com/en/products/pps-cf'
- 'Price (search snapshots 2026-11-25): Ultimate 3D Printing Store $129.99 / 0.75 kg; MatterHackers $189.99; https://ultimate3dprintingstore.com/collections/bambu-lab-filaments/products/bambu-lab-pps-cf-filament-1-75mm-0-75kg , https://www.matterhackers.com/store/l/bambu-lab-pps-cf-advanced-filament-175mm-075kg/sk/MFDCUGZU'
