notes: 'Alternative to PPA-CF, NOT recommended for the H1 frame: Z tensile 24 MPa (PAHT-CF 47, PPA-CF 57) and Z Charpy 2.8 kJ/m2 (PAHT 13.3) on a body whose layer normal is frame y; XY tensile 87 MPa is no better than PAHT-CF 88. Its strengths are chemistry and moisture: 0.05 % saturated water (PAHT 0.88, PPA 1.30), Tg 100 C, self-extinguishing. The H2S chamber (65 C max) is at the bottom of the TDS 60-90 C range, so Z on the owner printer is unlikely to beat the TDS 24 MPa (ASSUMPTION, settled by Z coupons). Frame-study ratios are ASSUMPTIONS (no published E(T), creep or S-N data for printed PPS-CF): env_knockdown_ratio 0.9 (hot only: PPS takes up almost no water, so no wet loss is taken; 0.9 covers 40 C below Tg 100 C), modulus_40c_wet_ratio 0.9, modulus_60c_ratio 0.8, creep_modulus_8h_40c_ratio 0.85, creep_rupture_8h_40c_ratio 0.55 (as PPA-CF, Tg higher still), fatigue_1e5_ratio 0.30 (the PA12-CF lower bound used for every printed frame material; a brittle 1.2 % elongation matrix could be lower: settled by CA-1 style R 0.1 coupons), modulus_minus20c_ratio 1.1 (already glassy at 23 C), impact_minus20c_ratio 0.5 (as PPA). Anneal 180-220 C is above anything the owner oven plan covers.'
