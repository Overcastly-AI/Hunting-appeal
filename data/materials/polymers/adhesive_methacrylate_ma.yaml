notes: 'ESTIMATE (grade-dependent). Pros: minimal surface prep (bonds lightly abraded composites and metals, tolerates
  some oil), high peel and impact toughness, good at temperature. Cons: short work life (~10 min at 23 C) is hard
  for a first-timer on multi-joint frames; strong odor (ventilate); not as stiff, slightly lower shear. Use for
  repairs and small single joints, or as an alternative if peel/impact tests on epoxy joints fail. Cost per 50 ml
  cartridge.'
