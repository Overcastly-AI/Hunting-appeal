sources:
- 'Bambu Lab PPA-CF Technical Data Sheet V1.0 (read 2026-11-25 via pdftotext): density 1.25 g/cm3 ISO 1183; Tg 85 C, Tm 258 C, Tc 178 C (DSC); Vicat 232 C; HDT 196 C at 1.8 MPa, 227 C at 0.45 MPa; saturated water 1.30 % at 25 C / 55 % RH; E XY 11800 +/- 670, Z 4300 +/- 340 MPa; tensile XY 168 +/- 4, Z 57 +/- 5 MPa; elongation XY 3.2, Z 0.9 %; flexural modulus XY 9860, Z 3240 MPa; flexural strength XY 208, Z 63 MPa; Charpy XY 41.7 unnotched / 6.5 notched, Z 4.3 kJ/m2; drying 100-140 C 8-12 h (blast oven); nozzle 0.4/0.6 (recommended)/0.8 mm, 280-310 C; bed 100-120 C, glue; chamber 50-80 C (70-80 C gives higher Z); max overhang ~70 deg; specimens X1C, chamber 52 C, 290 C, 80 mm/s, not annealed; anneal 120-140 C 6-12 h may warp and lower toughness; https://www.additive-x.com/shop/mpattachments/file/viewonline/id/916/product_id/2729'
- 'Raise3D Industrial PPA CF TDS V1.0 (Dec 2021), conditioned (annealed 100 C 8 h, 3 days ambient): XY 122 +/- 4 MPa, E 7800 MPa, elongation 1.9 %, mono-layer Z 30.2 +/- 1.4 MPa, density 1.15; https://cdn.shopify.com/s/files/1/2104/4351/files/Raise3D-Industrial-PPA-CF_TDS.pdf'
- 'Polymers 18(12):1422 (2026), Fiberlogy PPA CF15 FFF (Tg 60.5 C, density 1.06, a different grade): E 2.437 / 2.166 / 1.489 GPa and UTS 64.5 / 55.7 / 44.4 MPa at 20 / 40 / 60 C; R 0.1 fatigue, run-outs at 1e6, authors state a safe window below about 60-70 % UTS (their 20 C max stress 65.5 MPa exceeds their 20 C UTS, so not used as an allowable); no creep test; https://pmc.ncbi.nlm.nih.gov/articles/PMC13306934/'
- 'SimplyPrint filament page: abrasive, hardened steel nozzle; H2S / H2D / X1C listed among printers that print it well; 750 g spool; https://simplyprint.io/filaments/bambu-lab/ppa-cf'
- 'Price (search snapshots 2026-11-25, store pages block fetching): Bambu US store and Ultimate 3D Printing Store $149.99 / 0.75 kg; MatterHackers $198.00; https://ultimate3dprintingstore.com/products/bambu-lab-ppa-cf-filament-1-75mm-0-75kg , https://www.matterhackers.com/store/l/bambu-lab-ppa-cf-filament/sk/MF7C2ZUL'
- 'Bambu Lab PPA-CF product page (2026-11-01 read): dry 100-140 C 8-12 h, nozzle 280-310 C, bed 100-120 C, anneal 120-140 C 6-12 h; https://us.store.bambulab.com/products/ppa-cf'
- 'BL-073 tolerance factor: one-sided normal tolerance limit, 90 % coverage / 95 % confidence, k = t''(n-1, 0.95; delta = z_0.90 sqrt n) / sqrt n (noncentral t): n 5 3.407, n 6 3.006, n 10 2.355 (computed with scipy.stats.nct, matches the CMH-17-1G Vol 1 section 8.3.4.3 B-basis normal table and NIST/SEMATECH e-Handbook of Statistical Methods 7.2.6.3 "tolerance intervals for a normal distribution"); https://www.itl.nist.gov/div898/handbook/prc/section2/prc263.htm'
- 'BL-073 Tg vs water: Wetzel et al., Polymers 15(16):3387 (2023), PA66 DSC Tg 58 C dry, 24 C at 3.0 % water (23 C / 50 % RH), i.e. 11 C per wt % water; conditioning 70 C / 62 % RH reaches 3.2 % (ISO 1110 accelerated); https://pmc.ncbi.nlm.nih.gov/articles/PMC10459301/'
- 'BL-073 Tg vs water, PPA: Envalior (DSM) moisture diffusion white paper, ForTii MX51 PPA (glass filled) Tg 155 C dry, about 65 C at 3.4 wt % water (search snapshot 2026-11-25; the PDF link now returns 404); https://www.envalior.com/content/dam/envalior/en/documents/white-paper/envalior-moisture-diffusion-white-paper.pdf'
- 'BL-073 spool: Bambu PPA-CF is sold only as 0.75 kg net on a cardboard spool rated to 145 C, and is listed as not compatible with the AMS / AMS lite (retailer copy of the Bambu listing, 2026-11-25); https://www.matterhackers.com/store/l/bambu-lab-ppa-cf-filament/sk/MF7C2ZUL , https://simplyprint.io/filaments/bambu-lab/ppa-cf'
