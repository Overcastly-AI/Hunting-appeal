notes: 'TDS mechanicals are unannealed. Annealing (120-140 C, 6-12 h) can raise properties and can also warp a large flat part and cut toughness; the TDS says so. Environmental ratios are ASSUMPTIONS (no published E(T) or creep curve): 40 C and 60 C are still below Tg 85 C, so modulus_40c_wet_ratio 0.85, modulus_60c_ratio 0.75, creep_modulus_8h_40c_ratio 0.85, creep_rupture_8h_40c_ratio 0.55. env_knockdown_ratio 0.8 and fatigue_1e5_ratio 0.3 match the PAHT frame study (no printed-PPA fatigue curve). impact_minus20c_ratio 0.5 is an ASSUMPTION; Z elongation is already 0.9 %, so a cold drop is the risk. Saturated water absorption 1.30 % at 25 C / 55 % RH (TDS), higher than PAHT-CF.'
