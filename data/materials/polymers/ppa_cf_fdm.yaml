notes: 'BL-073 HOT/WET BASIS (supersedes the BL-069 design values for H1-P): the 2.4 SD factor had no source; it is replaced by the B-basis tolerance factor for the TDS sample size (n not stated in the TDS; ISO 527-1 minimum n 5, k 3.4066): Z 57 - 3.4066 x 5 = 39.97 MPa, XY 168 - 3.4066 x 4 = 154.4 MPa. The BL-069 0.73 is wet only at 23 C (Raise3D conditioned / Bambu dry), so a hot factor is added: hot_40c_ratio 0.85 (ASSUMPTION, derived in bl073_hotwet.hot_ratio: the lowest of the Fiberlogy PPA-CF15 UTS ratio 40 / 20 C = 0.864 and the Tg-shift readings of that curve with the wet Tg depressed by 11-26 C per wt % water, PA66 and ForTii PPA data, giving 0.85-0.89; 40 C is the hot condition every frame record uses, modulus_40c_wet_ratio / creep_8h_40c). hot_wet_knockdown_ratio 0.6205 = 0.73 x 0.85 on XY, Z and interlayer shear. Modulus: conditioned 7800 / 11800 = 0.661 (Raise3D) x hot 0.889 (Fiberlogy E 40 / 20 C) = 0.5876 (modulus_40c_wet_hw_ratio; the BL-069 0.85 contradicted the record, review 8 M-8). Wet Tg estimate 51-67 C: 85 - 26.5 C/% x 1.30 % (ForTii PPA rate, compound basis) = 51 C (booked), or 85 - 11.3 C/% x 1.63 % (PA66 rate on the matrix water, ASSUMPTION 0.8 matrix fraction) = 67 C. Settled by CA-3-HW (Z and SBS at 40 C on coupons conditioned to constant mass) and CA-4-HW. TDS mechanicals are dry as printed and unannealed (chamber 52 C). Annealing (120-140 C, 6-12 h, forced-air oven only) can raise properties but can warp a large flat part and cut toughness (TDS): no annealing credit is taken. DESIGN VALUES (BL-069, same as research/frame_comp_A.md 2.1): tensile_strength_z_design_mpa 45 = 57 - 2.4 SD (5 MPa); env_knockdown_ratio 0.73 = Raise3D conditioned XY 122 / Bambu dry XY 168 (cross-brand, conservative; ASSUMPTION WET-PPA, settled by coupon CA-3 on H2S prints conditioned 14 d at 23 C / 50 % RH); knocked-down design strengths XY 122.6, Z 32.9 MPa (PAHT-CF: 70.4 / 37.6) - PPA-CF is 1.74x PAHT in the layer plane but 0.87x across the layers. Raise3D mono-layer conditioned Z 30.2 MPa is 8 % BELOW the BL-069 knocked design Z 32.85 (review 8 M-1; the BL-069 wording \"sits at\" was wrong). Environmental ratios are ASSUMPTIONS (no published E(T) or creep curve for the Bambu grade): modulus_40c_wet_ratio 0.85, modulus_60c_ratio 0.75, creep_modulus_8h_40c_ratio 0.85, creep_rupture_8h_40c_ratio 0.55, all because 40 and 60 C are below Tg 85 C; cross-check: the Fiberlogy PPA CF15 grade (Tg 60.5 C) keeps E 0.89 at 40 C and 0.61 at 60 C, so 0.75 at 60 C for the Tg 85 C Bambu grade is plausible, not shown (settled by a 3-point bend coupon at 60 C, test CA-4). fatigue_1e5_ratio 0.30 matches the PAHT frame study (no Bambu S-N curve; the PA12-CF lower bound 0.25-0.32 at 1e6, research/frame_comp_A.md 2.2); the Fiberlogy PPA CF15 paper suggests 0.6-0.7 at 1e6 but its own max stress exceeds its UTS, so it is not credited (settled by CA-1 R 0.1 coupons in PPA-CF). impact_minus20c_ratio 0.5 is an ASSUMPTION; Z elongation is already 0.9 % and Z Charpy 4.3 kJ/m2 (PAHT 13.3), so a cold drop (HA-LS-1 T4c) is the main risk. Saturated water absorption 1.30 % at 25 C / 55 % RH (TDS), higher than PAHT-CF 0.88 %. H2S: chamber heater max 65 C (inside the TDS 50-80 C range, below the 70-80 C that Bambu says raises Z); hardened nozzle required (abrasive); dry to < 20 % RH and print from a dry box; glue on smooth or textured PEI; support material "for PA/PET". chamber_temp_c 65 is the H2S maximum, not a TDS optimum.'
