notes: 'Cost = EUR 2.90 / 1.19 x 1.09 USD/EUR (ASSUMPTION, repo rate) = USD 2.66/m ex VAT. 43 % lighter than
  poly_webbing_25mm (18 g/m) with a published break (12 kN) close to the polyester estimate (13.3 kN). The governing
  property is SLIP in hardware, which is unpublished and which both vendors warn about: use it only where a sewn eye
  or a box-X ends the run, or after LL-D passes on the exact ladder lock. Other cautions: UHMWPE creeps under
  sustained load (fibre property; LL-D includes a 24 h hold), twists easily (keep it square in a ladder lock), cuts
  on bare metal edges, and sews slippery (baste or clip before box-X; check the box-X in LL-D). Black only for our
  palette; the face has a slight sheen. Note: iter1_weight.py DYNEEMA_N = 11768 N reads daN as kgf (1200 x 9.807);
  the correct value is 12 000 N (the iter1 figure is 1.9 % conservative).'
