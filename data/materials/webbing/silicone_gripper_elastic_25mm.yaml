notes: 'ESTIMATE: mass_g_m and stretch_pct are ASSUMPTIONs (no listing gives a mass; typical 25 mm cycling-short
  gripper is about 8-12 g/m); weigh 1 m on arrival. The easiest grip face for a home builder: sew 2-3 rows flat
  (zig-zag 304, under no stretch) across the lumbar pad and the wing crest zone, about 0.6 m per belt = about 6 g.
  Elastic, so it must not be stretched when sewn, or it puckers the cone-cut face. Lines across the belt (vertical
  on the body) resist the vertical slip best. Sold for apparel and quilting, with inconsistent quality between lots:
  buy one lot for the prototype and HB-2 test pieces.'
