notes: 'Price USD 0.55/yd = USD 0.60/m (the BOM assumed USD 0.25/m; 144 yd rolls run about USD 0.10-0.40/m but are
  marketplace listings). 2.56 m per fly = about 7.7 g. Black only (white elastic usually carries optical brightener,
  bad for ungulate UV vision). Rubber-core elastic in a sil-poly hem channel ages with UV and heat; the channel shades
  it. Polyester braid does not roll in a 20 mm channel when sewn at one end and stretched through.'
