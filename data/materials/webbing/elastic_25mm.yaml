notes: 'Pick: art. 70111 (UV-resistant, firmer grip for strap-tail keepers that live outside). Price EUR 1.20 incl. VAT
  = EUR 1.01 ex VAT x 1.09 USD/EUR (ASSUMPTION) = USD 1.10/m (the BOM assumed USD 0.60). MASS: corrie_f.TAIL_KEEPER_G
  books 0.6 g per 90 mm keeper (6.7 g/m); this braid is 15 g/m, i.e. 1.35 g per keeper, and about +8 g on the 0.99 m net
  the BOM uses. The soft 73041 (11.9 g/m) saves about 3 g but is thinner and elastane-based (weaker in UV); use it only
  for inside keepers. Black; check for optical brightener under a UV torch before buying a lot (white braids often
  carry it). Elastic creeps and loses grip over seasons: keepers are a wear item.'
