notes: 'Weight, Taber abrasion, waterproofing and width are Challenge data (2026-11-09; weight was 155 gsm estimate).
  Taber 1100 cycles is on Challenge''s own scale, where the same guide puts 500D CORDURA at about 1800-2000 cycles
  (EPX600 2000 "comparable to 500d Cordura"; ULTRA100 3600 "twice 500d") - so ULTRAGrid is about 55-60 % of 500D and
  about level with 330D CORDURA. Grab and tear are not published (ASSUMPTION, see sources). UHMWPE grid yarns are
  slippery: use a tighter SPI and bartacks. Good body fabric for weight-focused builds.'
