notes: 'Candidate for the iter1 lever N2 (belt wing and lumbar faces, 380 -> 320 g/m2). Cost = EUR 19.90/m incl. VAT
  / 1.19 x 1.09 USD/EUR (ASSUMPTION, repo rate) / 1.6 m = USD 11.39/m2 ex VAT. Roll width 1600 mm is now on the maker page,
  which settles iter1 ASSUMPTION MESH-ROLL. The 320 vs 390 g/m2 conflict is a product change in July 2026: stock from
  before then, or a reseller lot, can still be 390 g/m2. WEIGH A SWATCH on receipt (100 x 100 mm, 5 punches across the
  width): accept 320 +/- 10 %; at 390 the N2 saving is gone (380 -> 390 is +2.6 %). Extremtextil publishes no abrasion
  number ("highly abrasion-resistant" only). The Shelby 3 mm mesh is the only spacer mesh found with published
  Martindale (>= 35 000 rev at 9 kPa) and EN ISO 13934-1 strip data, at about the same weight: if MESH-1 is to be
  skipped, buy the Shelby mesh instead and keep its certificate. Washing shrinkage up to 5 %: pre-wash or cut 5 % long
  in the knit direction only after a wash test on a swatch.'
