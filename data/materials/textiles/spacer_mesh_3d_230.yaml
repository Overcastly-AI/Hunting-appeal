notes: 'ESTIMATE (secondary source only). Candidate for the iter1 lever N1 (back panel BP-01, crown pad face BP-03,
  J-strap faces HS-J2). Cost = EUR 12.90/m incl. VAT / 1.19 x 1.09 USD/EUR (ASSUMPTION, repo rate) / 1.6 m roll =
  USD 7.38/m2 ex VAT. RISK: the 230 g/m2 article is a special-price item that the category page no longer shows; if it
  cannot be bought, the nearest real alternatives are the Rockywoods 3 mm meshes at 261-270 g/m2. At 270 g/m2 the N1
  saving is about 45.1 x (380-270)/(380-230) = 33 g, not 45 g (scaling of the iter1_weight N1 figure). Order a 0.5 m
  piece before committing and WEIGH A 100 x 100 mm SWATCH (5 punches, target 230 +/- 10 %). A slightly elastic mesh on a
  back panel can creep into the rail gutter: check MESH-2. Thinner (3 vs 4-4.5 mm) means less air gap and less
  cushion over the rail edges; the hip faces are not candidates (iter1 N1 leaves them out). Body face: put the open
  mesh side to the wearer, rib direction on the grain (patterns_v31 ONE_WAY rule for spacer mesh).'
