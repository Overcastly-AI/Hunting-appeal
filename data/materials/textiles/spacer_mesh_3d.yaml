notes: 'RE-SOURCED 2026-11-24 (BL-064). No 4.5 mm / 380 g/m2 product was found at any small-batch supplier. The
  record now stands for the Shelby Outdoor 3D Spacer Mesh 4 mm (350 g/m2 +/- 5 %, 150 cm); thickness changed 4.5 -> 4.0 mm
  to match it (no code reads thickness_mm). The booked areal density stays 380 g/m2 on purpose: it is conservative
  against the stand-in and inside the market bracket, and changing it would move every released ledger row; buying
  the stand-in would credit about -7.9 % on every spacer_mesh_3d row (350/380), to be booked only after a weighed
  metre. Price: USD 15/yd kept as the earlier estimate; the stand-in lists EUR 26.90 (the page does not state the unit
  or the VAT; the slider_10 record reads Shelby prices as incl. 25.5 % VAT): ask Shelby for an ex-VAT quote per metre. Body-contact face for back panel, shoulder straps
  and hipbelt; ventilates and stays quiet. Abrades in ~1-2 seasons at hip contact (earlier estimate, no data); the
  only spacer mesh with published Martindale data found is Shelby''s 3 mm (>= 35 000 rev at 9 kPa, record
  spacer_mesh_3d_320).'
