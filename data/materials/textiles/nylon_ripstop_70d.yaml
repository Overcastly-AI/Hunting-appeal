notes: 'Data-sheet values (RBTR states they are averages or estimates). Unit conversion 1 lbf = 4.448 N. ASTM D1424 is
  an Elmendorf (falling-pendulum) tear; the repo''s CORDURA tear values are tongue tear (D2261), so compare tear only
  within the same method. The D4966 Martindale value is an endpoint-limited ">" number (the 300D HyperD sheet gives
  >8000), so it does not rank fabrics; do not use it against Taber cycles. Weight: 92 gsm finished, not the 70 gsm the
  bag_weight_plan ASSUMPTION used. HUNTING: the RBTR stock has a fluorinated DWR and an FR finish; for a PFAS-free
  build buy the Extremtextil C0 Robic 70den (100 gsm, no published tear: do a tongue-tear check on a swatch). Use:
  roll-top collars, linings, pocket backs, stuff sacks.'
