notes: 'ESTIMATE: values typical of commercial PU-coated 500D CORDURA; exact numbers vary by mill and coating. Grab
  tensile per ASTM D5034, tongue tear ASTM D2261, Taber H-18 1000 g. Workhorse pack-body fabric: good abrasion-to-weight,
  very sewable, quiet-ish (air-textured yarn). PU coating hydrolyzes after ~5-10 years in heat/humidity. Printable:
  CORDURA nylon is routinely rotary-printed with acid dyes (NIR-compliant camo is made this way) - custom original
  camo needs a mill run (MOQ ~1000 m); not sublimation-printable. MEAT HAULING: PU coat hydrolyzes faster with repeated
  wet/warm/blood exposure; order TPU-coated version for the meat zone if available.'
