notes: 'Data-sheet values (RBTR: averages or estimates); 1 lbf = 4.448 N. Replaces the 170 gsm ASSUMPTION in
  bag_weight_plan.md (O-6): the real fabric is 133 gsm. Elmendorf tear (D1424) 32 / 25 N is low: use it for trim and
  accent panels that carry no load, not as a reinforcement doubler (SH-01 stays polyester_ht_630d_printable). Martindale
  ">8000" is endpoint-limited and does not rank against Taber. Small-batch friendly: original camo artwork is printed
  per order with no mill MOQ. HUNTING: fluorinated DWR on the stock base; ask about C0. Print on a swatch first and have
  the camo-designer check colour match, UV brightness and NIR reflectance.'
