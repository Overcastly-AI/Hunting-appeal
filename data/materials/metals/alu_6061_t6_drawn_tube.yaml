notes: 'Stock form chosen by BL-080 (docs/research/20261125_metal_stay_frames.md). Strength fields are the ASTM drawn-tube
  MINIMUMS (290 / 240 MPa), equal to the MMPDS S-basis in alu_6061_t6 (290 / 241); frame checks read alu_6061_t6 so the
  two records agree. cost_usd is the 7/8 x .049 in size (USD 30.00 / 48 in). Price per metre by size, 48 in lengths:
  3/4 x .035 in 16.4, 7/8 x .049 in 24.6, 7/8 x .065 in 31.9, 1 x .049 in 28.3 USD/m. Fatigue limit is unnotched
  R. R. Moore; apply Kt (clamp edge 2, transverse hole 3 in BL-080) and Goodman. Do not anneal and re-bend at home:
  natural ageing only reaches T4. Anodise or wax against squeak; keep a UHMWPE bushing between the tube and the carbon
  crown legs (galvanic).'
