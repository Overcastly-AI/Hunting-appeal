notes: 'Stock form chosen by BL-080 (docs/research/20261125_metal_stay_frames.md). Strength fields are the ASTM drawn-tube
  MINIMUMS (290 / 240 MPa), equal to the MMPDS S-basis in alu_6061_t6 (290 / 241); frame checks read alu_6061_t6 so the
  two records agree. cost_usd is the 7/8 x .049 in size (USD 30.00 / 48 in). Price per metre by size, 48 in lengths:
  3/4 x .035 in 16.4, 7/8 x .049 in 24.6, 7/8 x .065 in 31.9, 1 x .049 in 28.3 USD/m. Fatigue limit is unnotched
  R. R. Moore; apply Kt (clamp edge 2, transverse hole 3 in BL-080) and Goodman. Do not anneal and re-bend at home:
  natural ageing only reaches T4. Anodise or wax against squeak; keep a UHMWPE bushing between the tube and the carbon
  crown legs (galvanic).

  BL-082 CLAMP AND CRUSH (2026-11-25). Ring formulas, per mm of tube length, R = mean radius (D - t) / 2: first yield
  of a diametral line load w_y = pi Sy t^2 / (6 R) (M = w R / pi, sigma = 6 M / t^2); plastic collapse w_c = Sy t^2 / R;
  ovalisation dD = 0.1488 x 12 w R^3 / (E t^3) (closes along the load, opens about 0.92 x that across). 1 x .049 in:
  16.1 / 30.8 N/mm, 0.024 mm per N/mm; 3/4 x .035 in: 10.9 / 20.9 N/mm, 0.028 mm per N/mm. A conforming clamp
  (full wrap, uniform pressure p) instead takes hoop compression p R / t: yield at about 24 MPa and elastic ring buckling
  at about 18-21 MPa, far above any clamp pressure, so ovalisation under a clamp comes from the gaps and edges of a split
  clamp, not the average pressure. Rule for BL-081: model each clamp half as a cos-distributed or edge-line load and
  check against w_y over the effective contact length; keep the closing ovalisation below the crown-leg radial
  clearance (>= 0.3 mm required). CRUSH AT THROUGH-BOLTS: 2.6 kN M5 preload across a bare tube over a 20 mm saddle is
  130 N/mm, 4.2 x the 1 x .049 collapse load: the lower-node through-bolts need a crush sleeve (bore spacer, e.g. 5.5 x 7.9
  mm Al or steel tube cut to the tube ID span) or a torque cap below w_y x saddle length (about 320 N preload
  for 20 mm, useless for slip). ASSUMPTION CRUSH-SLEEVE.

  BL-082 FRICTION (static design values; ASSUMPTION FRICTION-POLY except al-al dry). Al-al dry 0.19 is the VDI 2230
  lower bound (range 0.19-0.41); wet al-al 0.15 is an ASSUMPTION between the lubricated band 0.07-0.12 and the dry
  minimum: the concept-B upper tee slip margin 1.63 at mu 0.2 becomes 1.22 at 0.15. PAHT-CF 0.20 dry / 0.15 wet: nylon on
  steel 0.4 kinetic less 25 % for carbon fibre (Gadelmoula 2023) is 0.30, taken at 2/3 for a design lower bound, wet
  lower again (water lubricates PA). TPU 95A 0.30 / 0.15 and EPDM tape 0.40 / 0.20: soft elastomers grip dry (PU about
  0.5 on steel) but a water film on smooth anodise can drop them to the polymer range. Same values for bare and
  anodised 6061 (the polymer side governs; anodise is harder and slightly rougher). PAHT creeps under a clamp
  (BL-076): no liner or printed part may sit in the preload path.

  CL-1 CLAMP-SLIP COUPON (settles every COF above, about USD 20 beyond the booked spare tube): 5 x 120 mm offcuts of 1 in
  x .049 tube (bare; repeat on anodised if anodising stays in the BOM); the production clamp (metal backers, liner as
  built: none, TPU 95A 1 mm, EPDM tape) on each, M5 A2 torqued with a click wrench to the release value, torque mark.
  Clamp the tube vertically in a vise, pull the clamp along the tube with a 50 kg digital hanging scale through a
  webbing loop at the clamp centreline, slowly (about 5 mm/s); record the peak (static slip) and plateau (kinetic).
  Conditions, n 5 each: dry 23 C; wet (soaked 1 h, tested dripping); wet after 24 h at 40 C under preload (liner creep and
  preload relaxation, re-pull without re-torque); cold -15 C from the freezer. Report slip load per clamp and
  mu_eff = F_slip / (sum of bolt preloads), preload from T = 0.2 F d (ASSUMPTION K 0.2, A2 dry). Accept: the minimum
  wet slip load >= the factored bar-end force (1278 N in frame_concepts.md) with no liner extrusion and no tube
  dent > 0.1 mm (feeler gauge across a straightedge).

  BL-082 PRICES / SHIPPING. Speedy Metals list: 72 in 1 x .049 USD 43.20, 3/4 x .035 USD 24.95 (tube only). A 72 in piece
  ships in a box over 48 in, which takes UPS Additional Handling USD 30-40.50 (+ peak 8.75-11.90): ESTIMATE about USD 58
  delivered on top of the tube (ship_72in_box_estimate_usd = 18 base ASSUMPTION SHIP-BASE + 40 handling, before fuel),
  so 72 in 1 x .049 + 12 in 3/4 x .035 lands at about USD 110 vs the USD 12 shipping booked in frame_concepts.md.
  Concept B needs 540 + 540 + 220 + 220 mm = 1520 mm of 1 in tube: 2 x 36 in (each 540 + 220 = 760 mm + kerf, USD 57.60)
  plus 12 in of 3/4 x .035 (USD 8.32) all ships under 48 in, about USD 84 delivered (ASSUMPTION SHIP-BASE 18), and is
  the cheaper buy. Get the shipping quote at checkout before ordering.'
