notes: 'Annealed bar, not cold-worked. A pressed-in pawl bushing sees bearing, not the polished fatigue limit. Cold-worked 304 is stronger (Sy ~400+ MPa) if the bushing is drawn tube; the annealed yield is the conservative check. Fatigue limit is a typical R=-1 rotating-beam figure for annealed 304, not a design allowable for this part.'
