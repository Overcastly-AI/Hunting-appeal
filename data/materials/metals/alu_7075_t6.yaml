notes: Typical values; design to MMPDS S-basis (yield_strength_sbasis_mpa) for load-path parts. Fatigue limit is
  R.R. Moore rotating-beam, 5e8 cycles, unnotched; apply Kt and size/surface factors. Poor weldability and SCC susceptibility
  in ST direction; good for machined frame hubs, load-lifter hardware, stays. Anodize to dull/dark finish to avoid
  glint.
