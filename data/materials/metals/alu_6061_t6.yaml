notes: 'Cheapest, most available tube/flat bar; weldable (weld HAZ drops to ~T4/O strength, do not weld load-path
  parts without re-heat-treat). Fatigue: R.R. Moore 5e8 cycles. Good for prototype stays and jigs; 7075/7001 preferred
  for production stays by ~1.8x specific strength.

  BL-082 FATIGUE (2026-11-25; fatigue_limit_mpa 96.5 is kept for the legacy checks that read it). (1) UNNOTCHED: mean
  curve Sa = 14479 / sqrt(N) + 96.5 MPa, fully reversed (Yahr 1993 fit to the MIL-HDBK-5D / Battelle / Alcoa data, rotating
  beam and axial). Mean-stress correction: modified Goodman on Su 290 MPa (the S-basis / ASTM drawn-tube minimum), sigma_a /
  S_f + sigma_m / S_u = 1, so S_max(R) = 2 S_f S_u / ((1 - R) S_u + (1 + R) S_f). Gerber values are listed for reference
  (Yahr: better fit for Al); the R 0.1 Gerber value at 1e5 is capped at yield 240. These are MEAN curves, not
  allowables: no scatter factor is applied (Yahr design curve = fit / 2 on stress, listed as asme_design_*). Note the
  BL-080 Basquin line (0.9 Su at 1e3 to 90.3 MPa at 5e8) gives S_a(1e5) = 180 MPa, 26 % above this fit (142.3): the BL-080
  notched R 0 allowable 74.0 MPa at Kt 3 becomes 63.6 MPa (Goodman) or 79.0 MPa (Gerber). (2) NOTCHED: 6061-T6 is
  fully notch-sensitive at small radii (q 0.95-1.00 at r 0.635 mm, 1e6-1e7). The D5.3 hole in the 1.24 mm wall has r
  2.65 mm; Peterson q = 1 / (1 + a / r) only rises with r, so take q = 1, Kf = Kt (notch_sensitivity_design_ratio).
  Kt comes from FEA or Peterson''s tube-with-transverse-hole charts; for a bolt-LOADED hole use the pin-loaded-hole Kt,
  not the open-hole one. Apply Kf to both alternating and mean (nominal allowable = unnotched S_max / Kf) unless local
  Kf S_max exceeds yield. (3) BOLTED / CLAMPED WITH PRELOAD: no cited 6061-T6 thin-tube data found. Clamping helps
  in plates (Chakherlou 2008, 2024-T3), but a through-bolt across a 1.24 mm tube wall cannot hold a useful preload
  (it crushes the tube unless a crush sleeve carries it, see alu_6061_t6_drawn_tube) and PAHT under the head creeps
  (BL-076). ASSUMPTION BJ-NOCREDIT: bolted_joint_preload_credit_ratio 1.0 = no preload credit; check the joint as a
  loaded hole at Kf = Kt. (4) ASSUMPTION ANODISE-FAT: sulfuric (Type II) anodised parts take 0.7 x fatigue strength
  (cited up to 30 % loss; thin parts possibly more), so leave fatigue-critical holes and clamp zones bare or use thin
  Type II (<= 10 um, no Type III). Settle with notched tube coupons at R 0.1 if B''s fatigue margin stays under 1.2.'
