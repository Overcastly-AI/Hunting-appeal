# Hunting-Appeal solid colorway line — PRIMARY system keyed to the OWNER BASE camo
# (owner-supplied 4-colour SVG, designs/apparel/camo/owner_base.yaml; DECISIONS 2026-11-01).
# Three solids are the owner's own inks (same hex), so a camo accent panel seamed to a solid
# body shares that exact colour across the seam. Two harmonious neutrals are derived from the
# owner palette (see `derivation` on each) to fill gaps the 4 inks leave for garment bodies.
# The previous Cirquefall-keyed system is kept intact under `alternate:` at the bottom.
# Generated values: sRGB / CIELAB computed with huntkit.camo.color (D65, CIE 1931 2 deg).
#
# Dye-lot QC (all colours):
#   - Measure: spectrophotometer, D65/10 deg, SCI, 4 readings averaged, conditioned fabric.
#   - Commercial acceptance: dE00 <= 1.0 (l:c 2:1 dE CMC <= 1.0 accepted as equivalent);
#     lot-to-lot within a garment (panel-to-panel shade match): dE00 <= 0.6.
#   - Metamerism check: also read under illuminant A and F11 (TL84); dE00 <= 1.5 vs standard.
#   - Darks (L* < 35): dE00 tolerance tightened on L only (|dL*| <= 0.7) since dark shades show
#     streaks; chroma tolerance relaxed to 1.2 (ASSUMPTION: typical outdoor-brand practice).
#   - Solid <-> printed-ink match (same hex in camo and solid): dE00 <= 1.5 between the solid
#     dyed fabric and the same ink printed on the accent fabric (ASSUMPTION: different
#     substrates/processes; tighter is not realistic across dye vs print).
# NO OPTICAL BRIGHTENERS: no fluorescent whitening agents (FWA/OBA) in fibre, dye bath, finish,
# DWR, laundering aids, labels or thread. Ungulates see into the near-UV; OBAs re-emit UV as
# visible blue glow. QC: UV-A (365 nm) lamp check on every lot — no visible fluorescence;
# if a spectro with UV-included/excluded modes is available, |dE00(UV in - UV out)| <= 0.5.
# This matters MOST for the two light owner inks (Bench Grass L* 65, Bleached Tine L* 74):
# light pale grounds are where an OBA-contaminated base fabric glows first.
# Colour standards: these hex/LAB values are DESIGN TARGETS. The physical standard is the
# approved lab dip on the actual base fabric (polyester vs nylon vs merino shift differently);
# record the approved dip LAB here as `lab_approved` once it exists.

qc_defaults:
  delta_e00_commercial: 1.0
  delta_e00_panel_match: 0.6
  delta_e00_metamerism_A_F11: 1.5
  optical_brightener: none_permitted
  uv_check: "365 nm lamp, no visible fluorescence"


solids:
  - key: sidehill_olive
    name: "Sidehill Olive"
    code: "HA 17-0830"
    hex: "#8B8148"
    srgb: [139, 129, 72]
    cielab_d65: [53.7, -4.5, 32.1]
    qc_tolerance: {dE00: 1.0}
    optical_brightener: "none — no FWA/OBA anywhere in the colour chain (see header)"
    derivation: "owner ink #8b8148 (olive), exact"
    description: "the owner's olive; workhorse mid-tone body colour"
    suits: ['softshell jacket & pant', 'hoody mid layer', 'pack body & lid']
    shared_with_camo: ['owner_base']
  - key: bench_grass
    name: "Bench Grass"
    code: "HA 15-1114"
    hex: "#AE9D6C"
    srgb: [174, 157, 108]
    cielab_d65: [65.1, -1.0, 27.9]
    qc_tolerance: {dE00: 1.0}
    optical_brightener: "none — no FWA/OBA anywhere in the colour chain (see header)"
    derivation: "owner ink #ae9d6c (base tan / field), exact"
    description: "the owner's field tan; open grass benches, early season"
    suits: ['lightweight early-season shirt & pant', 'softshell (open country)', 'pack side pockets, gaiters']
    shared_with_camo: ['owner_base']
  - key: deadfall_shadow
    name: "Deadfall Shadow"
    code: "HA 19-0510"
    hex: "#313120"
    srgb: [49, 49, 32]
    cielab_d65: [19.9, -3.4, 10.9]
    qc_tolerance: {dE00: 1.0, dL_max: 0.7, note: 'dark shade: L* held tight'}
    optical_brightener: "none — no FWA/OBA anywhere in the colour chain (see header)"
    derivation: "owner ink #313120 (dark), exact"
    description: "the owner's olive-black; trim, binding, webbing, zips, abrasion overlays (not full garments: too dark a silhouette)"
    suits: ['zip tapes, binding, webbing, cord', 'abrasion overlays (cuffs, hem, pack base)', 'thread for dark seams', 'pack harness & hipbelt']
    shared_with_camo: ['owner_base']
  - key: elk_wallow
    name: "Elk Wallow"
    code: "HA 18-0612"
    hex: "#5E5A40"
    srgb: [94, 90, 64]
    cielab_d65: [38.0, -3.0, 15.6]
    qc_tolerance: {dE00: 1.0}
    optical_brightener: "none — no FWA/OBA anywhere in the colour chain (see header)"
    derivation: "neutral: CIELAB ~45 % of the way from Sidehill Olive to Deadfall Shadow, chroma pulled down (L* 38, b* 15.6); same olive hue family"
    description: "dark olive-brown bridge; fills the L* 20 -> 54 gap in the owner palette, reads as timber shade"
    suits: ['rain shell & rain pant', 'dark-timber softshell', 'knee/seat reinforcement in solid builds', 'pack harness']
    shared_with_camo: []
  - key: lichen_stone
    name: "Lichen Stone"
    code: "HA 16-0308"
    hex: "#918B7D"
    srgb: [145, 139, 125]
    cielab_d65: [58.0, -0.3, 8.3]
    qc_tolerance: {dE00: 1.0}
    optical_brightener: "none — no FWA/OBA anywhere in the colour chain (see header)"
    derivation: "neutral: Bench Grass hue angle, chroma cut from 28 to 8, L* 58 (between olive and tan)"
    description: "low-chroma stone grey-tan; talus, late-season grass, the quiet neutral of the line"
    suits: ['insulated jacket & vest shells', 'late-season softshell', 'pack body (talus/late-season build)']
    shared_with_camo: []

# Owner-base inks that are NOT solids: Bleached Tine #C6B497 (light tan, L* 74) is a camo
# highlight only — too light and too low in chroma contrast to carry a whole garment.

# Accent pairings: solid body + Owner Base accent panels (ACCENT scale repeat, see
# owner_base.yaml) on yokes, forearms, side/underarm, knee/seat, pack lid, side pockets,
# hipbelt wings + trim (zips, binding, webbing) + thread. Panel geometry is unchanged from
# the Cirquefall system (huntkit/camo/export.py JACKET / PACK).
accent_pairings:
  - id: sidehill
    display_name: "Sidehill"
    body: sidehill_olive
    accent_pattern: owner_base
    accent_scale: accent
    trim: deadfall_shadow
    thread: sidehill_olive        # thread matches body; contrast lines come from the seams
    shared_inks: [sidehill_olive, deadfall_shadow]
    use: "flagship all-season system"
  - id: benchland
    display_name: "Benchland"
    body: bench_grass
    accent_pattern: owner_base
    accent_scale: accent
    trim: deadfall_shadow
    thread: bench_grass
    shared_inks: [bench_grass, deadfall_shadow]
    use: "open country / early season; light body, panels carry the dark"
  - id: wallow
    display_name: "Wallow"
    body: elk_wallow
    accent_pattern: owner_base
    accent_scale: accent
    trim: deadfall_shadow
    thread: elk_wallow
    shared_inks: [deadfall_shadow]
    use: "dark timber, rain shells, pack harness"
  - id: lichen
    display_name: "Lichen"
    body: lichen_stone
    accent_pattern: owner_base
    accent_scale: accent
    trim: deadfall_shadow
    thread: lichen_stone
    shared_inks: [deadfall_shadow]
    use: "talus / late season"

# ---------------------------------------------------------------------------------------
# ALTERNATE system: Cirquefall camo family + its solid line (was the primary until the
# owner supplied Owner Base). Unchanged; still rendered by `python -m huntkit.camo.cli all`.
alternate:
    note: "Cirquefall = alternate camo. Every solid here is also an ink in a Cirquefall palette."
    solids:
      - key: scree_dust
        name: "Scree Dust"
        code: "HA 14-0210"
        hex: "#9F9888"
        srgb: [159, 152, 136]
        cielab_d65: [63.0, -0.3, 9.3]
        qc_tolerance: {dE00: 1.0}
        optical_brightener: "none — no FWA/OBA anywhere in the colour chain (see header)"
        description: "stone grey-tan; the neutral that sits on talus, dry grass and sage"
        suits: ['softshell jacket & pant (early/mid season)', 'merino/synthetic base & mid layers', 'pack body (light-terrain build)']
        shared_with_camo: ['cirquefall', 'cirquefall_shard']
      - key: wind_slab
        name: "Wind Slab"
        code: "HA 14-4102"
        hex: "#A9ACA6"
        srgb: [169, 172, 166]
        cielab_d65: [70.0, -2.2, 2.7]
        qc_tolerance: {dE00: 1.0}
        optical_brightener: "none — no FWA/OBA anywhere in the colour chain (see header)"
        description: "cool light grey for late season / snow-transition"
        suits: ['insulated jacket & vest shells', 'late-season hardshell', 'pack body (late-season build)']
        shared_with_camo: ['cirquefall_firn', 'cirquefall_firn_shard']
      - key: krummholz_sage
