        srgb: [110, 116, 91]
        cielab_d65: [47.7, -7.0, 13.1]
        qc_tolerance: {dE00: 1.0}
        optical_brightener: "none — no FWA/OBA anywhere in the colour chain (see header)"
        description: "muted grey-green mid tone; workhorse body colour"
        suits: ['softshell jacket & pant', 'hoody mid layer', 'pack body & lid']
        shared_with_camo: ['cirquefall', 'cirquefall_shard']
      - key: cured_grass
        name: "Cured Grass"
        code: "HA 16-1118"
        hex: "#A08A68"
        srgb: [160, 138, 104]
        cielab_d65: [58.6, 3.2, 21.3]
        qc_tolerance: {dE00: 1.0}
        optical_brightener: "none — no FWA/OBA anywhere in the colour chain (see header)"
