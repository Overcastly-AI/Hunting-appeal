        suits: ['lightweight early-season shirt & pant', 'gaiters', 'pack side pockets']
        shared_with_camo: ['cirquefall', 'cirquefall_shard']
      - key: spruce_shadow
        name: "Spruce Shadow"
        code: "HA 19-0408"
        hex: "#4A4B3C"
        srgb: [74, 75, 60]
        cielab_d65: [31.4, -3.4, 8.8]
        qc_tolerance: {dE00: 1.0, dL_max: 0.7, note: 'dark shade: L* held tight'}
        optical_brightener: "none — no FWA/OBA anywhere in the colour chain (see header)"
