# Cirquefall Firn — LATE-SEASON / SNOW-TRANSITION variant of Cirquefall.
# Same structural rules (warped Voronoi talus slabs + fractures + two-scale flecks) with a
# colder, lighter 5-colour palette and coverage shifted toward light: patchy wind-scoured
# snow over rock and bare timber. Light (L*>=60) coverage 56 % vs 37 % in Cirquefall.
# Macro tone field is stretched horizontally (aniso 1.5) — snow lies in ledges and wind
# bands, so light masses read as horizontal drifts, not blobs.
extends: cirquefall
name: cirquefall_firn
display_name: "Cirquefall Firn"
environment: "late season: snow-transition, wind-scoured ridges, bare timber, grey rock"
seed: 9157
background: windslab
palette:
  - {key: firn,       name: "Firn",           code: "HA 11-4201", hex: "#D5D6D0", role: "light (snow, not white)"}
  - {key: windslab,   name: "Wind Slab",      code: "HA 14-4102", hex: "#A9ACA6", role: "light-mid cool grey"}
  - {key: frostsage,  name: "Frost Sage",     code: "HA 16-0207", hex: "#80867A", role: "mid"}
  - {key: baretimber, name: "Bare Timber",    code: "HA 18-1006", hex: "#5A5348", role: "dark warm"}
  - {key: basalt,     name: "Basalt Ink",     code: "HA 19-0805", hex: "#2D2B27", role: "darkest accent"}
layer_overrides:
  macro_light:
    color: firn
    coverage: 0.26
    field:
      warp: {seed_key: macro_warp, scale_mm: 520, amp_mm: 30, iterations: 1}
      components:
        - {type: voronoi_cells, seed_key: slabs, cell_mm: 230, jitter: 0.9, weight: 0.8}
        - {type: fbm, seed_key: macro_tone, scale_mm: 420, beta: 2.2, aniso_ratio: 1.5, aniso_angle_deg: 0, weight: 0.9}
      roughness: {scale_mm: 16, min_mm: 3, beta: 1.1, amp: 0.20}
  macro_sage:  {color: frostsage, coverage: 0.16}
  macro_grass: {color: windslab, coverage: 0.0}     # folded into background in winter
  macro_dark:  {color: baretimber, coverage: 0.17}
  fissure:     {color: basalt, coverage: 0.06}
  micro_dark:  {color: baretimber, coverage: 0.05}
  micro_light: {color: firn, coverage: 0.06}
