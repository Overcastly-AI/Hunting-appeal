# OWNER BASE — the PRIMARY camo (owner-supplied artwork; DECISIONS 2026-11-01).
# Cirquefall (cirquefall*.yaml) is now the ALTERNATE family.
#
# This file is a pattern SPEC for externally supplied artwork, not a procedural engine spec
# (it has no `layers`; huntkit.camo.engine.generate() does not render it). The pipeline is
# huntkit/camo/owner_base.py; previews/metrics come from huntkit/camo/owner_export.py:
#     python -m huntkit.camo.cli owner-base
#
# SOURCE STATUS: the master SVG is NOT yet in the repo. Until
# designs/apparel/camo/source/owner_base.svg exists, every image and number tagged
# "PROXY" comes from a procedural stand-in (owner_base_proxy) that only mimics the described
# structure. When the real file appears, load_owner_base() uses it automatically; re-run the
# CLI and replace every `measured_proxy` value below with the real measurement.
name: owner_base
display_name: "Owner Base"
status: primary
source:
  master_svg: designs/apparel/camo/source/owner_base.svg   # byte-exact owner upload
  present_in_repo: false                                   # flip to true when uploaded
  viewbox: [0, 0, 1000, 1000]
  paint_order:                       # as described by the owner file
    - "rect field #ae9d6c"
    - "paths #8b8148 (olive)"
    - "paths #c6b497 (light tan)"
    - "paths #313120 (dark)"
    - "pixel overlays #ae9d6c, #8b8148, #313120 (light tan is never an overlay)"
  structure:
    macro: "organic blobs traced from a 180x180 raster (5.556 unit cells), vectorised with diagonal (45 deg) corner smoothing"
    micro: "square 'digital' pixel clusters on a 64-cell (15.625 unit) and a 128-cell (7.8125 unit) grid, sprinkled along blob edges to break them up"
    character: "hybrid organic-macro / digital-micro"
  path_syntax: "straight segments only: M/L/H/V/Z (abs + rel), several subpaths per path (M..L..zM..)"
  fill_rule_assumed: evenodd

# Inks: names/codes are our own identifiers. Index order used by the pipeline = role order.
palette:
  - key: bench_grass
    role: field
    name: "Bench Grass"
    code: "HA 15-1114"
    hex: "#AE9D6C"
    srgb: [174, 157, 108]
    cielab_d65: [65.1, -1.0, 27.9]
  - key: sidehill_olive
    role: olive
    name: "Sidehill Olive"
    code: "HA 17-0830"
    hex: "#8B8148"
    srgb: [139, 129, 72]
    cielab_d65: [53.7, -4.5, 32.1]
  - key: bleached_tine
    role: light_tan
    name: "Bleached Tine"
    code: "HA 13-1008"
    hex: "#C6B497"
    srgb: [198, 180, 151]
    cielab_d65: [74.1, 1.8, 17.2]
  - key: deadfall_shadow
    role: dark
    name: "Deadfall Shadow"
    code: "HA 19-0510"
    hex: "#313120"
    srgb: [49, 49, 32]
    cielab_d65: [19.9, -3.4, 10.9]

qc:
  ink_tolerance_dE00: 1.0          # print strike-off vs target, D65/10
  solid_to_ink_match_dE00: 1.5     # same hex dyed solid vs printed ink (see colorways.yaml)
  optical_brightener: none_permitted
  uv_check: "365 nm lamp, no visible fluorescence (light inks + base fabric first)"

# Physical scale (1000 units = one repeat). Chosen from repeat_scale_study() — see
# previews/owner_base_scale_study.json and DESIGN.md "Owner Base" section.
repeat_mm:
  full:   {width: 760, height: 760}   # 0.76 mm/unit; 2 repeats across 1520 mm; same drum as Cirquefall
  accent: {width: 380, height: 380}   # 0.38 mm/unit; accent panels 150-400 mm; 4 across 1520 mm
  alternative_considered:
    "610 (24 in)": "works, but 2.49 repeats across 1520 mm (partial repeat) and less deer contrast at range than 760 (RMS 0.16 vs 0.20 at 150 m, 0.04 vs 0.07 at 300 m)"
    "305 (half of 610)": "REJECTED: finest pixel 2.38 mm < 2.5 mm printable floor"
    "320": "finest pixel exactly 2.5 mm (at the floor, no margin); 380 keeps 3.0 mm"

seamless:
  check: "edge_wrap_check: seam dE00 vs common-grid interior lines (250/500/750 units)"
  fix_if_needed: offset_blend      # label-space half-offset cross-fade, repeat size unchanged
  fallback: mirror                 # 2x2 reflected (visible symmetry), not preferred

proxy:
  generator: huntkit.camo.owner_base.owner_base_proxy
  seed: 20261101
  label: "PROXY — procedural stand-in, NOT the owner's artwork; replace with source/owner_base.svg"

# ---------------------------------------------------------------------------------------
# MEASURED ON THE PROXY (replace with real-file values after ingest). Source:
# previews/owner_base_metrics.json + owner_base_scale_study.json.
measured_proxy:
  coverage: {bench_grass: 0.416, sidehill_olive: 0.256, bleached_tine: 0.108, deadfall_shadow: 0.220}
  luminance_bands: {dark_L_lt_40: 0.22, mid_40_60: 0.26, light_L_ge_60: 0.52}
  coverage_weighted_mean_L: 53.2
  mean_colour_hex: "#978A5F"
  seam_check: {seamless: true, z_x: 2.88, z_y: 1.68, z_max: 3.5, fix_applied: none}
  full_760:
    feature_mm: {macro_cell: 4.2, pixel_64: 11.9, pixel_128: 5.9}
    deer_rms_contrast: {0m: 0.55, 10m: 0.47, 50m: 0.36, 150m: 0.20, 300m: 0.07}
    panel_flat_blob_fraction: {150mm: 0.18, 250mm: 0.07, 400mm: 0.01}
  accent_380:
    feature_mm: {macro_cell: 2.1, pixel_64: 5.9, pixel_128: 3.0}
    deer_rms_contrast: {0m: 0.55, 10m: 0.44, 50m: 0.26, 150m: 0.07, 300m: 0.00}
    panel_flat_blob_fraction: {150mm: 0.045, 250mm: 0.0, 380mm: 0.0}
  mean_vs_backgrounds_dE00_deer: {dry_bunchgrass: 2.6, sagebrush: 7.5, talus_scree: 12.0, aspen_bark_late: 15.9, shaded_snow: 27.7, dark_timber_floor: 28.1, conifer_shade: 30.4}

# Deer-vision analysis of the OWNER PALETTE (exact, does not depend on the proxy):
dichromat_findings:
  merged_pairs_dE00_lt_5: []                     # no pair merges for a deer
  pairs_deer_dE00_michelson:
    bench_grass/bleached_tine:   [9.0, 0.16]     # weakest: hue difference ~gone, tonal only
    bench_grass/sidehill_olive:  [10.2, 0.22]
    sidehill_olive/bleached_tine: [18.6, 0.37]
    sidehill_olive/deadfall_shadow: [30.0, 0.76]
    bench_grass/deadfall_shadow: [41.3, 0.84]
    bleached_tine/deadfall_shadow: [52.0, 0.88]
  L_ladder: {deadfall_shadow: 19.9, sidehill_olive: 53.7, bench_grass: 65.1, bleached_tine: 74.1}
  notes:
    - "The three light inks sit inside 20 L* (54-74); the dark is 34 L* below olive. No mid-dark ink."
    - "Tan/light-tan: dE00 9.0 and Michelson 0.16 for deer, enough to separate at close range but the highlight dissolves into the tan field first (blob ~70 mm full scale -> gone for deer by ~25 m). For comparison, Cirquefall's weakest pair (scree/grass) was 0.10, so this is acceptable but it is the pair to watch."
    - "The deer sim moves olive and tan toward each other in hue (a* goes from -4.5/-1.0 to -9.0/-8.2); their separation for deer is almost all luminance (dL 11)."

# RECOMMENDATIONS — owner colours are NOT changed; these are usage/scale/system tweaks.
recommendations:
  - "Keep the owner's 4 inks exactly. Bridge the L* 20->54 gap in the SYSTEM, not the print: the Elk Wallow solid (L* 38) is the body colour for timber builds."
  - "Use the ACCENT repeat (380 mm) on every panel under ~400 mm. At full scale 18 % of 150 mm panels land in plain tan field (flat blob) vs 4.5 % at accent scale."
  - "Dark ink share should stay >= ~18 % in the real file (proxy 22 %). It carries almost all macro luminance contrast; if the real file measures lower, the pattern will read as a flat tan at 50-150 m for deer."
  - "Seat the light-tan highlights next to dark/olive (as the owner file does along blob edges) rather than isolated in tan: tan/light-tan alone is a weak 0.16 step."
  - "Habitat: the pattern mean matches dry bunchgrass (deer dE00 2.6) and is a strong open-country/early-season pattern; it is weak in dark timber (28) and snow (28). Use Wallow body or the Cirquefall alternate there."
  - "Body choice by terrain (solid vs background, deer dE00): Lichen Stone on sagebrush 2.2 / talus 3.9; Bench Grass on bunchgrass 5.1; Elk Wallow on dark timber floor 9.5. Sidehill Olive is the flagship look but is 11 from sage and 7.5 from grass."
  - "Chroma: olive (C* 32) and tan (C* 28) are fairly saturated for western camo; on lab dips hold chroma to the low side of tolerance and check NIR (dark ink must not be NIR-black)."
  - "No OBA: most critical on the light inks and the base fabric under them."
