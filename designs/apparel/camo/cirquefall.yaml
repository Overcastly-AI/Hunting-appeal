# Cirquefall — original multi-environment western-mountain camo (macro + micro, 6 colours)
# Procedural rules are entirely our own (periodic warped Voronoi "talus slabs" + FFT fractal
# noise + fracture lines + two-scale fleck layer). Not derived from any commercial pattern.
# Rationale and metrics: DESIGN.md. Engine: huntkit/camo/engine.py.
name: cirquefall
display_name: "Cirquefall"
version: 1
environment: "multi-season western mountain: sub-alpine timber, talus/scree, sage & cured grass"
seed: 7311
repeat_mm: {width: 760, height: 760}   # vertical repeat = rotary screen / sublimation drum repeat
# ASSUMPTION: 760 mm horizontal repeat -> 2 repeats across 1520 mm print width (1.5 m fabric
# with selvedge margin). Repeat is fully periodic in both axes.
field_px_per_mm: 1.25                  # resolution of the procedural fields (DPI-independent)
background: scree                      # gets the coverage left over by the layers

palette:   # names are our own; TCX-style codes are internal (HA = Hunting-Appeal)
  - {key: scree,   name: "Scree Dust",    code: "HA 14-0210", hex: "#9F9888", role: "light-mid ground"}
  - {key: granite, name: "Granite Fleck", code: "HA 13-0105", hex: "#BEB9AC", role: "light highlight"}
  - {key: sage,    name: "Krummholz Sage", code: "HA 17-0312", hex: "#6E745B", role: "mid, green"}
  - {key: grass,   name: "Cured Grass",   code: "HA 16-1118", hex: "#A08A68", role: "mid, warm"}
  - {key: spruce,  name: "Spruce Shadow", code: "HA 19-0408", hex: "#4A4B3C", role: "dark mass"}
  - {key: basalt,  name: "Basalt Ink",    code: "HA 19-0805", hex: "#2D2B27", role: "darkest accent"}

# Layers are listed BACK to FRONT (painting order). `coverage` = final VISIBLE fraction of
# the repeat (the engine solves thresholds top-down so these are met exactly).
layers:
  # ---------------- MACRO scale (230-480 mm): silhouette break at 50-150 m ----------------
  - name: macro_light
    scale: macro
    color: granite
    coverage: 0.14
    field:
      warp: {seed_key: macro_warp, scale_mm: 520, amp_mm: 30, iterations: 1}
      components:
        - {type: voronoi_cells, seed_key: slabs, cell_mm: 230, jitter: 0.9, weight: 1.0}
        - {type: fbm, seed_key: macro_tone, scale_mm: 420, beta: 2.2, weight: 0.55}
      roughness: {scale_mm: 16, min_mm: 3, beta: 1.1, amp: 0.20}
  - name: macro_sage
    scale: macro
    color: sage
    coverage: 0.20
    field:
      warp: {seed_key: macro_warp, scale_mm: 520, amp_mm: 30, iterations: 1}
      components:
        - {type: fbm, seed_key: sage_mass, scale_mm: 340, beta: 2.0, weight: 1.0}
        - {type: voronoi_cells, seed_key: slabs, cell_mm: 230, jitter: 0.9, value_seed: sage, weight: 1.0}
      roughness: {scale_mm: 14, min_mm: 3, beta: 1.1, amp: 0.22}
  - name: macro_grass
    scale: macro
    color: grass
    coverage: 0.12
    field:
      warp: {seed_key: macro_warp, scale_mm: 520, amp_mm: 30, iterations: 1}
      components:
        - {type: fbm, seed_key: grass_mass, scale_mm: 300, beta: 2.0, aniso_ratio: 1.4, aniso_angle_deg: 70, weight: 1.0}
        - {type: voronoi_cells, seed_key: slabs, cell_mm: 230, jitter: 0.9, value_seed: grass, weight: 1.0}
      roughness: {scale_mm: 12, min_mm: 3, beta: 1.1, amp: 0.22}
  - name: macro_dark
    scale: macro
    color: spruce
    coverage: 0.18
    field:   # complement of macro_light (negative weights on the same draws) => dark masses sit opposite the light slabs
      warp: {seed_key: macro_warp, scale_mm: 520, amp_mm: 30, iterations: 1}
      components:
        - {type: voronoi_cells, seed_key: slabs, cell_mm: 230, jitter: 0.9, weight: -1.0}
        - {type: fbm, seed_key: macro_tone, scale_mm: 420, beta: 2.2, weight: -0.55}
        - {type: fbm, seed_key: dark_detail, scale_mm: 190, beta: 1.8, weight: 0.35}
      roughness: {scale_mm: 16, min_mm: 3, beta: 1.1, amp: 0.20}
  # ---------------- MID scale: fracture lines along slab boundaries -----------------------
  - name: fissure
    scale: mid
    color: basalt
    coverage: 0.07
    field:
      warp: {seed_key: macro_warp, scale_mm: 520, amp_mm: 30, iterations: 1}
      components:
        - {type: voronoi_edges, seed_key: slabs, cell_mm: 230, jitter: 0.9, width_mm: 8, weight: 1.0}
        - {type: fbm, seed_key: fissure_break, scale_mm: 90, beta: 1.6, weight: 0.4}
      modulate: [{by: macro_dark, weight: 0.45}]   # shadows pool in the dark masses
      roughness: {scale_mm: 10, min_mm: 3, beta: 1.0, amp: 0.25}
  # ---------------- MICRO scale (8-40 mm): blends at 5-50 m ----------------------------
  - name: micro_dark
    scale: micro
    color: spruce
    coverage: 0.06
    field:   # dark flecks clustered INSIDE light areas (local contrast that averages out with distance)
      warp: {seed_key: micro_warp, scale_mm: 120, amp_mm: 14, iterations: 1}
      components:
        - {type: fbm, seed_key: micro_a, scale_mm: 38, min_mm: 5, beta: 1.3, weight: 1.0}
      modulate: [{by: macro_light, weight: 0.9}]
      roughness: {scale_mm: 6, min_mm: 2.5, beta: 1.0, amp: 0.25}
  - name: micro_light
    scale: micro
    color: granite
    coverage: 0.05
    field:   # light flecks clustered INSIDE dark masses
      warp: {seed_key: micro_warp, scale_mm: 120, amp_mm: 14, iterations: 1}
      components:
        - {type: fbm, seed_key: micro_b, scale_mm: 32, min_mm: 5, beta: 1.3, weight: 1.0}
      modulate: [{by: macro_dark, weight: 0.9}]
      roughness: {scale_mm: 6, min_mm: 2.5, beta: 1.0, amp: 0.25}

micro_texture:   # optional tonal grain; OFF for rotary/screen print (breaks flat separations)
  enabled: false
  scale_mm: 3.0
  amp: 0.05
