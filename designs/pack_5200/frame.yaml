description: Carbon frame sized by huntkit.fea.sizing5200v2 against HA-LS-1 (designs/pack_5200/analysis/load_standard.md).
  'frame' = params for huntkit.fea.frames.build_frame (dispatches to huntkit.fea.pack5200.build); override
  torso_in (15-23) and extension_posts. Units mm.
load_standard: HA-LS-1 (designs/pack_5200/analysis/load_standard.md)
