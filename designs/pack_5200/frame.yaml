# Pack 5200 carbon frame - generated by `python -m huntkit.fea.cli size5200`.
# Read with huntkit.fea.frames.build_frame_from_yaml(path, torso_in=..).
schema: huntkit.frame/v1
design: pack_5200
description: Carbon frame sized by huntkit.fea.sizing5200 on the pack-designer topology (geometry.yaml).
  'frame' = params for huntkit.fea.frames.build_frame (dispatches to huntkit.fea.pack5200.build); override
  torso_in (15-23) and extension_posts. Units mm.
frame:
  topology: pack5200_crown
  name: pack5200_frame
  geometry: designs/pack_5200/geometry.yaml
  torso_in: 19.0
  haul_mode: false
  extension_posts: false
  stay_section:
    type: composite_tube
    od: 25
    layup:
    - angle: 45
      material: cfrp_t300_3k_woven_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 45
      material: cfrp_t300_3k_woven_epoxy_ply
  leg_section:
    type: composite_tube
    od: 20.0
    layup:
    - angle: 45
      material: cfrp_t300_3k_woven_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 45
      material: cfrp_t300_3k_woven_epoxy_ply
  bar_section:
    type: composite_tube
    od: 22
    layup:
    - angle: 45
      material: cfrp_t300_3k_woven_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 45
      material: cfrp_t300_3k_woven_epoxy_ply
  lumbar_plate_material: cfrp_plate_quasi_iso
  lumbar_plate_t: 4.0
  bushing_len_mm: 70.0
  joint:
    adhesive: adhesive_methacrylate_ma
    adhesive_G_mpa: 300.0
    adhesive_t_mm: 0.5
    overlap_mm: 30.0
    through_overlap_mm: 40.0
    sleeve_t_mm: 2.0
  spine_section:
    type: composite_tube
    od: 20
    layup:
    - angle: 45
      material: cfrp_t300_3k_woven_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 0
      material: cfrp_t700_ud_epoxy_ply
    - angle: 45
      material: cfrp_t300_3k_woven_epoxy_ply
torso_range_in:
- 15
- 23
stock:
- part: lower stay (foot boot -> elbow sleeve)
  qty: 2
  section: OD 25 mm round
  wall_mm: 1.19
  layup: '[twill +-45 / UD 0 x6 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 133.9
  cut_length_mm: 118.9
- part: upper stay (elbow sleeve -> stay-top collar)
  qty: 2
  section: OD 25 mm round
  wall_mm: 1.19
  layup: '[twill +-45 / UD 0 x6 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 400.3
  cut_length_mm: 385.3
- part: crown leg (telescoping)
  qty: 2
  section: OD 20 mm round
  wall_mm: 1.44
  layup: '[twill +-45 / UD 0 x8 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 430.0
  cut_length_mm: 430.0
- part: mid bar (z 330)
  qty: 1
  section: OD 22 mm round
  wall_mm: 1.19
  layup: '[twill +-45 / UD 0 x6 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 230.0
  cut_length_mm: 187.0
- part: upper bar (z 520, pawl housing)
  qty: 1
  section: OD 22 mm round
  wall_mm: 1.19
  layup: '[twill +-45 / UD 0 x6 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 230.0
  cut_length_mm: 187.0
- part: crown top bar
  qty: 1
  section: OD 22 mm round
  wall_mm: 1.19
  layup: '[twill +-45 / UD 0 x6 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 230.0
  cut_length_mm: 187.0
- part: crown spine tube (rack bonded on)
  qty: 1
  section: OD 20 mm round
  wall_mm: 1.19
  layup: '[twill +-45 / UD 0 x6 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 300.0
  cut_length_mm: 300.0
joints:
  adhesive: adhesive_methacrylate_ma
  bondline_mm: 0.5
  bondline_control: 0.5 mm glass beads or wire shims
  adhesive_shear_modulus_mpa_ASSUMPTION: 300.0
  socket_overlap_mm: 30.0
  through_sleeve_overlap_mm: 40.0
  sleeves: 7075-T6 hard-anodised, wall 2 mm, ends tapered to 0.3 mm over 8 mm
  elbow: 7075 elbow sleeve, 30 mm socket each side (shear, no peel), bonded
  foot_boot: 7075 boot bonded 25 mm over the stay foot, shelf-pivot boss + bumper
  mid_hub / upper_hub: 7075 through-sleeve 40 mm on the upper stay + 30 mm socket for the bar; CF gusset
  stay_top_collar: '7075 collar bonded over the stay top: crown-leg bushing seat (UHMWPE 70 mm) - reinforces
    the stay ring against bushing load'
  crown_corner: '7075 corner: socket for leg top + socket for top bar + extension-post socket'
  lumbar_plate: cfrp_plate_quasi_iso 4 mm bonded to both stays over z 50-190 (saddle fillet), Ti pivot
    insert with 70 mm backing doubler
  galvanic: 'no bare Al on carbon: anodise + glass-bead bondline / E-glass ply'
mass_g:
  'tubes: stay_lower': 37.0
  'tubes: stay_upper': 110.5
  'tubes: mid_bar': 27.7
  'tubes: upper_bar': 27.7
  'tubes: crown_leg': 112.3
  'tubes: crown_top_bar': 27.7
  'tubes: crown_spine': 32.7
  lumbar plate (250 x 140): 217.0
  7075 sockets/sleeves + gussets: 337.9
  adhesive (incl. lumbar-plate bond): 43.4
  foot boots (2): 28.0
  Ti hipbelt pivot insert: 28.0
  crown rack + pawl housing + pulley guides: 44.0
  UHMWPE bushings (4): 23.0
  spine clamp: 6.0
mass_total_g: 1103.0
mass_budget_g: 525.0
crown_loads_fea:
  sign: + = crown pulled UP out of the stays (extension), - = pushed DOWN (compression)
  basis: 'pawl link force, huntkit.fea.pack5200 (pulley assumed slack: the pawl takes everything)'
  by_case_worst_torso:
    static_carry:
      force_n: 32.4
      torso_in: 23
    drop_2p5g:
      force_n: 81.0
      torso_in: 23
    side_hill_torsion:
      force_n: 79.6
      torso_in: 15
    single_stay_setdown:
      force_n: -250.3
      torso_in: 23
    meat_shelf_heavy_low:
      force_n: 331.8
      torso_in: 23
    tall_load:
      force_n: 333.8
      torso_in: 15
    overload_haul:
      force_n: 266.4
      torso_in: 23
    hipbelt_off_abuse:
      force_n: 850.2
      torso_in: 15
    tall_load_posts:
      force_n: 331.0
      torso_in: 23
  max_extension_n: 850.2
  max_compression_n: -250.3
  pack_designer_estimate_n:
    extension: 1001.0
    compression: 1334.0
    rack_rating_wet: 5328.0
results:
  feasible: true
  min_margin: 1.093
  governing: 'tall_load: bond peak elbow_L/end'
  governing_torso_in: 15
  margin_by_check:
    member: 1.158
    buckling: 1.978
    bond_avg: 1.998
    bond_peak: 1.093
    crown: 1.103
    plate: 3.349
    plate_buckling: 10.529
    fatigue: 2.728
source: huntkit/fea/sizing5200.py; designs/pack_5200/analysis/frame_sizing.md
