stock:
- part: stay, straight (foot boot -> stay-top wrap collar)
  qty: 2
  section: OD 20 mm round
  wall_mm: 0.815
  layup: '[twill 0/90 / UD 0 x3 / twill 0/90]'
  source: standard roll-wrapped stock (twill 0/90 outer + UD core), e.g. Rock West / DragonPlate catalogue
  centreline_mm: 530.1
  cut_length_mm: 525.1
- part: crown leg (telescoping, low bushing bonded on its bottom end)
  qty: 2
  section: OD 16 mm round
  wall_mm: 1.19
  layup: '[twill +-45 / UD 0 x6 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 430.0
  cut_length_mm: 430.0
- part: mid bar (z 330)
  qty: 1
  section: OD 18 mm round
  wall_mm: 0.94
  layup: '[twill +-45 / UD 0 x4 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 230.0
  cut_length_mm: 210.0
- part: upper bar (z 520, pawl housing)
  qty: 1
  section: OD 22 mm round
  wall_mm: 0.94
  layup: '[twill +-45 / UD 0 x4 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 230.0
  cut_length_mm: 210.0
- part: crown top bar
  qty: 1
  section: OD 18 mm round
  wall_mm: 0.94
  layup: '[twill +-45 / UD 0 x4 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 230.0
  cut_length_mm: 214.0
- part: crown spine tube (rack bonded on)
  qty: 1
  section: OD 20 mm round
  wall_mm: 0.94
  layup: '[twill +-45 / UD 0 x4 / twill +-45]'
  source: roll-wrapped, +-45 twill wraps over a UD core (special-order wrap from the same vendors)
  centreline_mm: 300.0
  cut_length_mm: 300.0
joints:
  adhesive: adhesive_methacrylate_ma (tube-to-tube fit-up, fillets) + wet-layup epoxy for the wraps
  bondline_mm: 0.5
  adhesive_shear_modulus_mpa_ASSUMPTION: 300.0
  wrap: cfrp_plate_quasi_iso-equivalent wrap, 0.75 mm = 3 plies 3k twill alternating 0/90 and +-45, wet-laid
    (or prepreg) over sanded tubes, peel-ply + shrink tape, room-temp cure + 65 C post-cure
  wrap_overlap_mm: 30 on each tube (through-joints 40); wrap ends scarfed / ply-dropped over 8 mm (peel
    relief, not credited)
  stay: ONE straight tube per side, foot boot -> stay top (no lumbar elbow)
  foot_boot: 7075 boot bonded 25 mm over the stay foot, carries the shelf-pivot boss 20 mm outboard (keeps
    the shelf pivot at x +-135) + bumper
  mid_hub / upper_hub: bar end coped (fish-mouthed) to the stay, tacked with MMA, then carbon-wrapped
    (tube-to-tube, bicycle-frame style); CF gusset in the wrap
  stay_top_collar: carbon wrap 0.75 mm over the stay top; UHMWPE bushing 70 mm with a 120 deg contact
    land seats inside
  low_bushing: UHMWPE 70 mm sleeve bonded on the crown-leg bottom end (slides in the stay bore)
  crown_corner: leg top + top bar coped and wrapped; extension-post socket = short 7075 liner inside the
    wrap
  lumbar_plate: formed QI CFRP pan 1.5 mm, return flanges 25 mm top + bottom, face 25 mm toward the body;
    lands bonded to both stays z 50-190; CF pad-up 1 mm behind the Ti pivot insert
  galvanic: 'no bare Al on carbon: anodise + glass-bead bondline / E-glass ply under any Al liner'
