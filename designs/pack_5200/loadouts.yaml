# Canonical hunting loadouts for the Pack 5200 / CORRIE packing study.
# Owner: pack-designer. 2026-11-08. Research: docs/research/hunting_loadouts.md ([HL §n]).
# Consumed by designs/pack_5200/concepts/corrie_loadout.py (tests: tests/test_corrie_loadout.py).
#
# Rules
# - Every mass and every volume traces to a key in `sources` (URL) or is an explicit `ASSUMPTION: ...` string.
#   `mass_src` covers mass_g, `vol_src` covers vol_L and dims_mm.
# - mass_g / vol_L are per unit; `qty` in a loadout multiplies them. Volumes are PACKED volumes (stuff sack,
#   case or folded size). oz -> g at 28.35 g/oz.
# - access: constant (several times an hour, often without stopping) | hourly (about once an hour, on the move) |
#   glassing (at each stop, pack usually off) | weather | daily (once a day / at camp) | camp | kill | emergency.
# - pref: zones in preference order. The packer uses the first zone the configuration has and that has room.
#   Zone ids are defined in corrie_loadout.ZONES. Zones not built on CORRIE today (e.g. scope_sleeve_L,
#   bottle_hip, hydro_sleeve, door_pocket) are skipped in the "today" configuration.
# - Worn clothing, boots and the weapon in the hands are not in the pack load (zone `hands`/`chest` = on the body).

