# Anthropometry inputs for the Pack 5200 head-clearance check (pack-designer, 2026-11-01).
# Source data: ANSUR II public release (US Army anthropometric survey 2012, released 2017):
#   ANSUR_II_MALE_Public.csv (n 4082) and ANSUR_II_FEMALE_Public.csv (n 1986), downloaded 2026-11-01 from
#   https://www.openlab.psu.edu/ansur2/ (files at tools.openlab.psu.edu/publicData/). Methods: Gordon et al.,
#   NATICK/TR-15/007 (2014). Percentiles computed per sex (never pooled, per the dataset notes). Units mm.
# Derived: vertex_above_c7 = stature - cervicaleheight; torso_vertical = cervicaleheight - iliocristaleheight
#   (a VERTICAL distance; the pack torso is measured ALONG the spine, which is why the 15-23 in range is longer).
# Posture / range-of-motion inputs (cited, used in build_geometry.head_clearance):
posture:
  craniovertebral_angle_deg: {mean: 48.8, sd: 6.8, used: 48.8, sensitivity: 55.0,
    note: 'C7-tragion line vs horizontal, 122 healthy adults, unloaded (Zarate-Tejero et al., Applied Sciences 2024, https://zaguan.unizar.es/record/145251). Design case = the unloaded mean (load carriage pushes the head FORWARD, i.e. lowers the CVA, so this is already conservative for a loaded hunter: ASSUMPTION, confirm on the prototype with a side photo). Sensitivity = mean + 1 SD (55 deg, upright head sits further aft)'}
  cervical_extension_rom_deg: {mean: 59.1, sd: 10.2,
    note: 'goniometric, 300 healthy adults 18-29 (Apti et al. 2023, https://avesis.iku.edu.tr/yayin/e6a38307-12a9-4526-9d9f-efa478dba5e1/normative-values-for-cervical-and-lumbar-range-of-motion-in-healthy-young-adults)'}
  upper_cervical_share: {value: 0.39,
    note: 'O-C2 ROM 23.1 deg (Imagama et al. 2020, via https://springerlink.bibliotecabuap.elogim.com/content/pdf/10.1007/s00586-020-06547-9.pdf) / 59.1 deg total'}
