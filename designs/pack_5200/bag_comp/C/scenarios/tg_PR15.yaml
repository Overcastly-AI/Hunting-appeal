      - {id: H2, anchor_R: [126.3, 11.8, 330.0], anchor_L: [-126.3, 11.8, 330.0]}
      - {id: H3, anchor_R: [141.0, 8.2, 520.0], anchor_L: [-141.0, 8.2, 520.0]}
