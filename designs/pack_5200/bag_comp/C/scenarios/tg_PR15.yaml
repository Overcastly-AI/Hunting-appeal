# cinched wraps (W1-W3 stowed, as CORRIE D7 daily carry). Anchors on the frame plane at x = +/-0.76 a(z) (the sim's
# wrap path starts there, q 1.88 / 3.12), y = y_frame - 2. The 85 mm spotter rides in IMP-1 on the LEFT GUSSET, hung
# from the B-01 | B-03L seam (DECISION: not on the zip seam).
