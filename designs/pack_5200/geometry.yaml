meat_harness:
  concept: 'INTERNAL MEAT HARNESS, both modes required (owner 2026-11-01). 3 x 38 mm straps (IM1-IM3) anchor on
    the fairlead eyes. Bag on: meat inside the bag, cinched against the carbon spreader (BP-06). Bulk (float, owner
    2026-11-06): the bag comes off its pins, the meat is cinched eye-to-eye on IM1-IM3 against the spreader in the
    under-strap cradle, and the bag hangs upright behind it on two B-24 stand-off links at the IM3 eyes. Bag off:
    the same, with the bag set aside. The wearer touches the stay-rail foam (BP-02), not the sheet. Record: analysis/meat_haul_modes.md.'
  straps:
  - id: IM1
    z: 190.0
    anchors: [meat_anchor_z190_R, meat_anchor_z190_L]
    frame_node: lumbar-pan top land on the stay (bonded, torsion box)
    path_bag_on_mm: 653
    path_float_mm: 670
    cut_length_mm: 990
  - id: IM2
    z: 330.0
    anchors: [meat_anchor_z330_R, meat_anchor_z330_L]
    frame_node: mid-bar node (same node the v2 shelf straps loaded)
    path_bag_on_mm: 703
    path_float_mm: 670
    cut_length_mm: 1023
  - id: IM3
    z: 520.0
    anchors: [meat_anchor_z520_R, meat_anchor_z520_L]
    frame_node: upper-bar node
    path_bag_on_mm: 763
    path_float_mm: 670
    cut_length_mm: 1083
  anchor_stub: {material_id: poly_webbing_38mm, length_mm: 200.0, qty: 6, fixing: 'girth hitch round the stay directly
      above/below the bonded node wrap (cannot slide), sewn eye box-X bartacked with bonded_nylon_tex135', port: B-01
      slot 45 x 6 mm at x +/-100 through a 40 x 60 Hypalon patch on the inside face (B-12); self-closing lips; carries
      no load}
  hardware_family: 'MEAT: 38 mm webbing (only 38 mm on the pack), aluminium sliding-gate hooks + 38 mm metal cam
    with a glove pull-tab. No squeeze buckles, so it cannot be confused with HIP/ROLL; wider than HAUL (25 mm, G-hook)'
  stow: 'unused: hook each strap across B-01 port-to-port and cam it flat against the panel (doubles as internal
    compression for a small load); or unhook and roll it into the fly pocket'
  wash: 'plain polyester webbing + anodised Al hardware, no foam, no hook-and-loop: unhook and machine-wash cold;
    stubs rinse on the frame; ports are raw-edge Hypalon (no fray, no wicking)'
  external_wraps: 'W1-W3 KEPT: carry-mode compression, the outer clamp round bag and meat in float mode, and lash
    straps for antlers/cape. Internal straps hold the meat; wraps hold the bag. Merging was rejected: an internal
    strap cannot also compress the outside of the bag or close the float'
  load_cases:
    bag_on_rated:
      basis: 68 kg meat inside the bag, CG 150 mm aft of the stay, 2.0 g stumble (HA-LS-1); vertical into the bag
        bottom + hinge pins, overturning reacted by the straps in proportion to height
      aft_pull_per_strap_n: [86, 179, 305]
      leg_tension_n: [193, 240, 303]
    frame_only_quarter: {basis: '36 kg bone-in quarter, no shelf: friction hold mu 0.4 at the 1.6 g walking peak,
        5 clamping straps (IM1-IM3 + W1/W2)', leg_tension_n: 141}
    required_leg_capacity_n: 605
    capacities_n: {poly_webbing_38mm (record): 20016, 'girth-hitched stub, 2 legs (record x2)': 40032, box-X bartack tex135 (ASSUMPTION): 2700.0,
      38 mm Al cam buckle slip (ASSUMPTION): 1100.0, 38 mm Al sliding-gate hook (ASSUMPTION): 1500.0}
    min_margin: 1.82
    governing: 38 mm Al cam buckle slip (ASSUMPTION)
  mass_g: 240.3
  ip: 'Mystery Ranch US 8,579,171 (sling between frame and bag) EXPIRED; stubs girth-hitch at nodes, not through
    a frame slot (US 2014/0263519); deleting the shelf removes the ''adjustable shelf'' element of US 10,952,523
    claim 1. SG Terminus internal load cell and KUIU internal meat sleeve: no patents found for SG; KUIU''s patent-pending
    covers its corrugated frame. Attorney FTO before tooling'
