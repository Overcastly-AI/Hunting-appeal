  crown_retention:
    concept: 'Pulley-tensioned telescoping crown: a 3:1 webbing pulley (25 mm poly webbing, UHMWPE-lined guides,
      metal cam buckle) sets crown height continuously, while worn. A two-way toothed rack + spring pawl is the
      positive lock: pull the release toggle (left shoulder strap) to lift the pawl, pull the tail to shorten /
      ease the cam and shrug to lengthen, let go and the pawl drops into the nearest tooth.'
    sign_convention: extension = crown pushed up out of the stays; compression = pushed down
    load_cases:
      drop_2p5g_extension: {load_n: 334.0, sf: 2.0, basis: 68 kg x 2.5 g x 20 % shoulder share (spec drop case),
        required_n: 668.0}
      overload_extension: {load_n: 268.0, sf: 1.5, basis: 91 kg x 1.5 g x 20 % (FEA overload_haul case), required_n: 402.0}
      hipbelt_off_abuse_extension: {load_n: 1001.0, sf: 1.0, basis: 'ASSUMPTION abuse: hipbelt unbuckled (creek
          crossing), 68 kg x 1.5 g, 100 % on shoulders; no slip, no damage', required_n: 1001.0}
      tall_load_compression: {load_n: -667.0, sf: 2.0, basis: 'ASSUMPTION: 40 % of 68 kg lashed to crown/extension
          posts x 2.5 g pushes the crown DOWN', required_n: 1334.0}
    required_capacity_n: {extension: 1001.0, compression: 1334.0, note: lock (rack+pawl) must hold BOTH with zero
        slip; ultimate >= 1.5 x these}
    pulley: {mechanical_advantage: 3, guide_friction_mu: 0.1, capstan_factor: 1.87, routing: 'dead end on crown
        spine bottom -> fixed guide A (lumbar plate top, z 190) -> moving guide B (crown spine bottom) -> fixed
